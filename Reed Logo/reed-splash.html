<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reed – Splash</title>
<style>
:root{--navy:#00148C;--cyan:#2fd7fc;--ease:cubic-bezier(.16,1,.3,1)}
html,body{margin:0;height:100%;background:#f4f6fb;font-family:system-ui,sans-serif;overflow:hidden}

/* ===== Reed splash: Lockup Unfold ===== */
#reed-splash{--s:1;position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--navy);
  transition:opacity calc(350ms*var(--s)) ease,visibility 0s linear calc(350ms*var(--s))}
#reed-splash.out{opacity:0;visibility:hidden;pointer-events:none}
#reed-splash::before{content:"";position:absolute;width:70vmin;height:70vmin;border-radius:50%;
  background:radial-gradient(closest-side,rgba(47,215,252,.22),transparent);opacity:0}
.lockup{position:relative;width:min(78vw,440px);height:auto;overflow:visible;transform:translateX(36.2%)}
.icon{fill:var(--cyan);opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.wm path,.tag{fill:#fff;opacity:0}
.wm path{transform:translateX(-46px)}
.tag{transform:translateY(26px)}

/* Timeline (x --s): R pop 0-550 | slide 450-1150 | letters 450-1180 | tagline 900-1400 */
#reed-splash.play::before{animation:glow calc(1200ms*var(--s)) ease-out forwards}
#reed-splash.play .lockup{animation:slide calc(700ms*var(--s)) var(--ease) calc(450ms*var(--s)) forwards}
#reed-splash.play .icon{animation:pop calc(550ms*var(--s)) ease-out forwards}
#reed-splash.play .wm path{animation:letter calc(600ms*var(--s)) var(--ease) forwards;
  animation-delay:calc((450ms + var(--i)*70ms)*var(--s))}
#reed-splash.play .tag{animation:rise calc(500ms*var(--s)) var(--ease) calc(900ms*var(--s)) forwards}

@keyframes pop{0%{opacity:0;transform:scale(.8);filter:blur(8px)}
  55%{opacity:1;transform:scale(1.05);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes slide{to{transform:translateX(0)}}
@keyframes letter{to{opacity:1;transform:translateX(0)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%{opacity:0;transform:scale(.7)}50%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes fade{to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .lockup{transform:none!important;animation:none!important}
  .wm path,.tag{transform:none!important}
  #reed-splash.play .icon,#reed-splash.play .wm path,#reed-splash.play .tag{
    animation:fade 300ms forwards!important;transform:none;filter:none}
}

/* ===== Demo app behind the splash (remove in your app) ===== */
.app{padding:24px;display:grid;gap:12px;max-width:480px;margin:0 auto}
.card{height:84px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);opacity:0;transform:translateY(12px)}
body.ready .card{animation:up .5s var(--ease) forwards;animation-delay:calc(var(--n)*50ms)}
@keyframes up{to{opacity:1;transform:none}}
#replay{position:fixed;right:12px;bottom:12px;z-index:10000;padding:8px 14px;border:0;border-radius:999px;background:var(--navy);color:#fff;font:600 13px system-ui;cursor:pointer}
</style>
</head>
<body>

  <div class="card" style="--n:0"></div><div class="card" style="--n:1"></div>
  <div class="card" style="--n:2"></div><div class="card" style="--n:3"></div>
</div>
<button id="replay">Replay</button>

<script>
(function () {
  var el = document.getElementById('reed-splash');
  var KEY = 'reed_splash_seen';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function seen() { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } }

  function play(forceFull) {
    var fast = seen() && !forceFull;                 // lần mở sau: chạy nhanh ~0.55x
    var s = reduce ? 0.4 : (fast ? 0.55 : 1);
    el.style.setProperty('--s', s);
    el.classList.remove('play', 'out'); void el.offsetWidth; el.classList.add('play');
    document.body.classList.remove('ready');

    var minTime = new Promise(function (r) { setTimeout(r, 1800 * s); });   // animation + nhịp giữ logo
    var loaded  = new Promise(function (r) {
      document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true });
    });
    Promise.all([minTime, loaded]).then(function () {
      el.classList.add('out');
      document.body.classList.add('ready');
      document.dispatchEvent(new CustomEvent('reed:splash-done'));
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
    });
  }

  document.getElementById('replay').onclick = function () { play(true); };
  play(false);
})();
</script>
