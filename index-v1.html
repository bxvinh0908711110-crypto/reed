<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your English</title>
<style>
:root{
  --bg:#faf6ef; --card:#fffdf9; --ink:#2b2622; --muted:#7b7068; --line:#eadfce;
  --accent:#d9822b; --accent-soft:#fbe9d2; --up:#1f8a5b; --up-soft:#dcf3e8;
  --shadow:0 8px 30px rgba(80,50,10,.10);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1917;--card:#26221f;--ink:#f1e9df;--muted:#a89b8f;--line:#3a332d;
    --accent:#f0a04b;--accent-soft:#4a3520;--up:#4fd09a;--up-soft:#173a2c;--shadow:0 8px 30px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--accent)}
.tag{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);overflow:hidden}
.scene{display:block;width:100%;height:auto;background:var(--accent-soft)}
.body{padding:20px 22px 22px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.topic{font-weight:700;font-size:17px}
.lvl{font-size:12px;background:var(--accent-soft);color:var(--accent);
  padding:3px 10px;border-radius:999px;font-weight:600}
.text{font-size:21px;line-height:1.75;margin:6px 0 4px}
.hl{display:inline-block;vertical-align:top;border:0;border-bottom:2.5px solid var(--accent);
  background:linear-gradient(transparent 60%,rgba(255,200,60,.45) 60%);
  color:inherit;font:inherit;padding:0 3px;cursor:ns-resize;border-radius:3px;touch-action:none;
  transition:border-color .3s,color .3s}
.hl:hover,.hl.open{background:linear-gradient(transparent 60%,rgba(255,200,60,.75) 60%)}
.hl.up{border-bottom-color:var(--up);color:var(--up);font-weight:600;
  background:linear-gradient(transparent 60%,var(--up-soft) 60%)}
.roll{display:block;overflow:hidden;height:1.75em;transition:width .35s cubic-bezier(.3,.9,.3,1)}
.rw{display:block;transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.rw>span{display:block;height:1.75em;line-height:1.75em;white-space:nowrap}
.rw i{font-style:normal;display:inline-block}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.vi{display:none;margin:0 0 14px;padding:10px 14px;border-left:3px solid var(--line);
  color:var(--muted);font-size:15px}
.vi.show{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
button.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.play{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.on{background:var(--up-soft);border-color:var(--up);color:var(--up)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.prog{font-size:13px;color:var(--muted)}
#pop{position:absolute;z-index:20;width:min(300px,calc(100vw - 32px));background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);
  padding:14px 16px;display:none}
#pop.show{display:block}
#pop .from{font-size:13px;color:var(--muted)}
#pop .to{font-size:20px;font-weight:700;color:var(--up);margin:2px 0 4px}
#pop .to small{font-size:12px;background:var(--up-soft);padding:2px 8px;border-radius:999px;
  margin-left:6px;vertical-align:middle}
#pop .vn{font-size:14px;margin-bottom:6px}
#pop .ex{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:10px}
#pop .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#pop .chip{font-size:13px;padding:4px 10px}
#pop .chip small{opacity:.6;font-size:11px}
#pop .chip.cur{background:var(--up);border-color:var(--up);color:#fff}
#pop .row{display:flex;gap:8px}
#pop button{font:inherit;font-size:13px;border-radius:10px;padding:6px 12px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
#pop button.use{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}
footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Your <span>English</span></h1>
    <div class="tag">Mỗi ngày một đoạn ngắn</div>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="card">
    <div id="scene"></div>
    <div class="body">
      <div class="meta"><div class="topic" id="topic"></div><div class="lvl" id="lvl">A2</div></div>
      <div class="text" id="text"></div>
      <p class="hint">Cuộn chuột (hoặc vuốt lên/xuống) trên cụm gạch chân để trượt qua từ mới. Bấm vào để xem nghĩa.</p>
      <div class="vi" id="vi"></div>
      <div class="bar">
        <button class="btn play" id="play">▶ Nghe</button>
        <div class="seg" id="voice">
          <button data-v="female" aria-pressed="true">Giọng nữ</button>
          <button data-v="male" aria-pressed="false">Giọng nam</button>
        </div>
        <div class="seg" id="rate">
          <button data-r="0.8" aria-pressed="false">Chậm</button>
          <button data-r="1" aria-pressed="true">Vừa</button>
        </div>
        <span class="spacer"></span>
        <span class="prog" id="prog"></span>
      </div>
      <div class="bar" style="border:0;padding-top:10px">
        <button class="btn" id="all">✨ Nâng cấp tất cả</button>
        <button class="btn" id="tr">Dịch tiếng Việt</button>
      </div>
    </div>
  </div>
  <footer>Prototype MVP · Không cần chọn level, bài nào cũng mở.</footer>
</div>
<div id="pop" role="dialog"></div>

};
function opts(pi,i){
  const h = passages[pi].hl[i];
  return h.opts || (h.opts = [{w:h.o,lv:"A2"},{w:h.u,lv:h.lv},...(EXTRA[h.o]||[]).map(([w,lv])=>({w,lv}))]);
}

/* ---------- Trạng thái ---------- */
let cur = 0, sel = {}, voiceKind = "female", rate = 1, showVi = false;
const $ = id => document.getElementById(id);
const pop = $("pop");
let popIdx = null, pinned = false, hideTimer = null;
const getSel = i => sel[i] || 0;
const upCount = () => passages[cur].hl.filter((_,i)=>getSel(i)>0).length;

function fullText(){
  return passages[cur].tpl.replace(/\{(\d)\}/g,(_,i)=> opts(cur,+i)[getSel(+i)].w);
}

/* ---------- Render ---------- */
function renderTabs(){
  $("tabs").innerHTML = passages.map((p,i)=>
    `<button class="tab" role="tab" aria-selected="${i===cur}" data-i="${i}">${i+1}. ${p.topic}</button>`).join("");
}
function renderText(){
  const p = passages[cur];
  $("text").innerHTML = p.tpl.replace(/\{(\d)\}/g,(_,i)=>{
    const rows = opts(cur,+i).map(o=>`<span><i>${o.w}</i></span>`).join("");
    return `<button class="hl" data-i="${i}" aria-label="Cuộn để đổi từ"><span class="roll"><span class="rw">${rows}</span></span></button>`;
  });
  document.querySelectorAll(".hl").forEach(b=>applySel(+b.dataset.i,true));
  updateMeta();
}
function applySel(i,instant){
  const b = document.querySelector(`.hl[data-i="${i}"]`); if(!b) return;
  const k = getSel(i), n = opts(cur,i).length;
  const roll = b.querySelector(".roll"), rw = b.querySelector(".rw");
  if(instant){ roll.style.transition = rw.style.transition = "none"; }
  roll.style.width = b.querySelectorAll("i")[k].offsetWidth + "px";
  rw.style.transform = `translateY(-${k*100/n}%)`;
  b.classList.toggle("up", k>0);
  if(instant){ void rw.offsetWidth; roll.style.transition = rw.style.transition = ""; }
}
function updateMeta(){
  const p = passages[cur], n = upCount();
  $("prog").textContent = `Đã nâng cấp ${n}/${p.hl.length}`;
  $("all").classList.toggle("on", n === p.hl.length);
  $("all").textContent = n === p.hl.length ? "↺ Về bản gốc" : "✨ Nâng cấp tất cả";
  $("lvl").textContent = n ? "A2 → B1/B2" : p.level;
}
function renderPassage(){
  const p = passages[cur];
  stopSpeech(); hidePop(true);
  $("scene").innerHTML = scenes[p.scene];
  $("topic").textContent = p.topic;
  $("vi").textContent = p.vi;
  $("vi").classList.toggle("show", showVi);
  $("tr").textContent = showVi ? "Ẩn bản dịch" : "Dịch tiếng Việt";
  renderTabs(); renderText();
}
function setSel(i,k){
  const n = opts(cur,i).length;
  sel[i] = ((k % n) + n) % n;
  applySel(i); updateMeta();
  if(popIdx === i && pop.classList.contains("show")) setTimeout(()=>{
    const b = document.querySelector(`.hl[data-i="${i}"]`); if(b) showPop(b,pinned);
  },320);
}

/* ---------- Popup ---------- */
function showPop(btn, pin){
  clearTimeout(hideTimer);
  const i = +btn.dataset.i, h = passages[cur].hl[i], o = opts(cur,i), k = getSel(i);
  popIdx = i; pinned = pinned || pin;
  pop.innerHTML = `<div class="from">Cách nói hay hơn cho “${h.o}”</div>
    <div class="to">${o[k].w}<small>${o[k].lv}</small></div>
    <div class="vn">${h.vn}</div><div class="ex">“${h.ex}”</div>
    <div class="chips">${o.map((x,j)=>`<button class="chip${j===k?" cur":""}" data-k="${j}">${x.w} <small>${x.lv}</small></button>`).join("")}</div>
    <div class="row"><button class="say">🔊 Nghe từ này</button></div>`;
  pop.classList.add("show");
  document.querySelectorAll(".hl").forEach(b=>b.classList.toggle("open", b===btn));
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth;
  let left = r.left + scrollX + r.width/2 - w/2;
  left = Math.max(12, Math.min(left, scrollX + document.documentElement.clientWidth - w - 12));
  pop.style.left = left + "px";
  pop.style.top = (r.bottom + scrollY + 8) + "px";
}
function hidePop(force){
  if(pinned && !force) return;
  pop.classList.remove("show"); popIdx = null; pinned = false;
  document.querySelectorAll(".hl.open").forEach(b=>b.classList.remove("open"));
}
function scheduleHide(){ clearTimeout(hideTimer); hideTimer = setTimeout(()=>hidePop(), 250); }

const text = $("text");
text.addEventListener("mouseover",e=>{
  const b = e.target.closest(".hl"); if(b && !pinned) showPop(b,false);
});
text.addEventListener("mouseout",e=>{ if(e.target.closest(".hl")) scheduleHide(); });
text.addEventListener("click",e=>{
  const b = e.target.closest(".hl"); if(!b) return;
  e.stopPropagation();
  if(pop.classList.contains("show") && popIdx === +b.dataset.i && pinned){ hidePop(true); return; }
  pinned = false; showPop(b,true);
});
/* Cuộn chuột trên cụm từ -> trượt qua từ khác */
let lastWheel = 0;
text.addEventListener("wheel",e=>{
  const b = e.target.closest(".hl"); if(!b) return;
  e.preventDefault();
  const now = Date.now(); if(now - lastWheel < 260 || Math.abs(e.deltaY) < 4) return;
  lastWheel = now; setSel(+b.dataset.i, getSel(+b.dataset.i) + (e.deltaY > 0 ? 1 : -1));
},{passive:false});
/* Vuốt lên/xuống trên điện thoại */
let ty = null, tx = null;
text.addEventListener("touchstart",e=>{
  if(!e.target.closest(".hl")) return; ty = e.touches[0].clientY; tx = e.touches[0].clientX;
},{passive:true});
text.addEventListener("touchend",e=>{
  const b = e.target.closest(".hl"); if(!b || ty===null) return;
  const dy = ty - e.changedTouches[0].clientY, dx = tx - e.changedTouches[0].clientX; ty = null;
  if(Math.abs(dy) > 22 && Math.abs(dy) > Math.abs(dx)){
    e.preventDefault();
    setSel(+b.dataset.i, getSel(+b.dataset.i) + (dy > 0 ? 1 : -1));
  }
});
text.addEventListener("keydown",e=>{
  const b = e.target.closest(".hl"); if(!b || !/^Arrow(Up|Down)$/.test(e.key)) return;
  e.preventDefault(); setSel(+b.dataset.i, getSel(+b.dataset.i) + (e.key==="ArrowDown"?1:-1));
});

pop.addEventListener("mouseenter",()=>clearTimeout(hideTimer));
pop.addEventListener("mouseleave",scheduleHide);
pop.addEventListener("click",e=>{
  e.stopPropagation();
  const chip = e.target.closest(".chip");
  if(chip){ pinned = true; setSel(popIdx, +chip.dataset.k); return; }
  if(e.target.closest(".say")) speak(opts(cur,popIdx)[getSel(popIdx)].w);
});
document.addEventListener("click",()=>hidePop(true));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hidePop(true); });

/* ---------- Điều khiển ---------- */
$("tabs").addEventListener("click",e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  cur = +t.dataset.i; sel = {}; renderPassage();
});
$("all").addEventListener("click",()=>{
  const p = passages[cur], all = upCount() === p.hl.length;
  hidePop(true);
  p.hl.forEach((_,i)=>setSel(i, all ? 0 : 1));
});
$("tr").addEventListener("click",()=>{
  showVi = !showVi; $("vi").classList.toggle("show",showVi);
  $("tr").textContent = showVi ? "Ẩn bản dịch" : "Dịch tiếng Việt";
});
$("voice").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  voiceKind = b.dataset.v;
  [...$("voice").children].forEach(x=>x.setAttribute("aria-pressed", x===b));
});
$("rate").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  rate = +b.dataset.r;
  [...$("rate").children].forEach(x=>x.setAttribute("aria-pressed", x===b));
});
$("play").addEventListener("click",()=>{
  if(speechSynthesis.speaking){ stopSpeech(); return; }
  speak(fullText());
});

/* ---------- TTS của trình duyệt ---------- */
const FEMALE = /zira|samantha|jenny|aria|susan|hazel|libby|sonia|female|karen|moira|tessa|victoria/i;
const MALE = /david|mark|guy|ryan|daniel|alex|james|george|thomas|male|fred|oliver/i;
function pickVoice(kind){
  const en = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const us = en.filter(v=>/en[-_]US/i.test(v.lang));
  const pool = us.length ? us : en;
  const re = kind==="female" ? FEMALE : MALE, other = kind==="female" ? MALE : FEMALE;
  return pool.find(v=>re.test(v.name) && !(kind==="female" && /\bmale\b/i.test(v.name) && !/female/i.test(v.name)))
      || en.find(v=>re.test(v.name))
      || pool.find(v=>!other.test(v.name)) || pool[0] || null;
}
function speak(t){
  if(!("speechSynthesis" in window)){ alert("Trình duyệt chưa hỗ trợ đọc văn bản."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  const v = pickVoice(voiceKind);
  u.lang = "en-US"; if(v){ u.voice = v; u.lang = v.lang; }
  u.rate = rate;
  u.pitch = voiceKind==="female" ? 1.15 : 0.8;
  u.onstart = ()=>{ $("play").textContent = "■ Dừng"; };
  u.onend = u.onerror = ()=>{ $("play").textContent = "▶ Nghe"; };
  speechSynthesis.speak(u);
}
function stopSpeech(){ if("speechSynthesis" in window) speechSynthesis.cancel(); $("play").textContent = "▶ Nghe"; }

renderPassage();
</script>
</body>
