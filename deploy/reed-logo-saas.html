<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reed Logo Animation</title>
<style>
  :root { --cyan:#2fd7fc; --blue:#3b82f6; --violet:#8b5cf6; --bg:#060a14; --ease:cubic-bezier(.22,1,.36,1); }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); display:grid; place-items:center; overflow:hidden;
         font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; color:#fff; }

  /* nền: aurora + lưới mờ */
  .aurora { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; will-change:transform; }
  .b1 { width:46vmax; height:46vmax; left:-12vmax; top:-18vmax; background:radial-gradient(circle,var(--cyan),transparent 65%); animation:drift1 14s ease-in-out infinite alternate; }
  .b2 { width:42vmax; height:42vmax; right:-14vmax; bottom:-16vmax; background:radial-gradient(circle,var(--violet),transparent 65%); animation:drift2 16s ease-in-out infinite alternate; }
  .b3 { width:30vmax; height:30vmax; left:35vw; top:55vh; background:radial-gradient(circle,var(--blue),transparent 65%); opacity:.35; animation:drift1 18s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform:translate(8vmax,6vmax) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-7vmax,-5vmax) scale(1.1); } }
  .grid { position:fixed; inset:0; z-index:0;
          background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
          background-size:56px 56px;
          -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 20%,transparent 75%);
                  mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 20%,transparent 75%); }

  /* thẻ kính */
  .stage { position:relative; z-index:1; width:min(900px,92vw); cursor:pointer; }
  .card { position:relative; padding:clamp(28px,6vw,72px) clamp(24px,6vw,80px); border-radius:28px;
          background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
          border:1px solid rgba(255,255,255,.12);
          box-shadow:0 30px 80px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18);
          backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
          opacity:0; transform:translateY(24px) scale(.97); }
  .card::before { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; pointer-events:none;
          background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--cyan),var(--violet),transparent);
          -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
                  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
          opacity:0; }
  @property --a { syntax:'<angle>'; initial-value:0deg; inherits:false; }
  .play .card { animation:cardIn .9s var(--ease) .05s forwards; }
  .play .card::before { animation:spin 6s linear 1.2s infinite, fadeIn 1s ease 1.2s forwards; }
  @keyframes cardIn { to { opacity:1; transform:none; } }
  @keyframes spin { to { --a:360deg; } }
  @keyframes fadeIn { to { opacity:1; } }

  svg { width:100%; height:auto; overflow:visible; display:block; position:relative; }

  /* glow sau icon */
  .glow { position:absolute; left:6%; top:50%; width:26%; aspect-ratio:1; transform:translate(-30%,-50%) scale(.4);
          background:radial-gradient(circle,rgba(47,215,252,.6),transparent 65%); filter:blur(30px); opacity:0; }
  .play .glow { animation:glowIn 1.4s var(--ease) .9s forwards, breathe 4s ease-in-out 2.4s infinite; }
  @keyframes glowIn { to { opacity:.9; transform:translate(-30%,-50%) scale(1.2); } }
  @keyframes breathe { 50% { opacity:.55; transform:translate(-30%,-50%) scale(1.05); } }

  /* icon: nét vẽ -> gradient -> nảy spring -> trôi nhẹ */
  .icon-float { transform-box:fill-box; transform-origin:center; }
  .play .icon-float { animation:bob 5s ease-in-out 2.6s infinite; }
  @keyframes bob { 50% { transform:translateY(-6px); } }
  .icon-wrap { transform-box:fill-box; transform-origin:center; opacity:0; transform:scale(.6) rotate(-8deg); }
  .play .icon-wrap { animation:iconIn 1s cubic-bezier(.34,1.56,.64,1) .7s forwards; }
  @keyframes iconIn { to { opacity:1; transform:none; } }
  .icon-path { fill:url(#iconGrad); fill-opacity:0; stroke:var(--cyan); stroke-width:2.5; stroke-dasharray:1; stroke-dashoffset:1; }
  .play .icon-path { animation:draw 1.2s cubic-bezier(.65,0,.35,1) .6s forwards, fillin .6s ease-out 1.5s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fillin { to { fill-opacity:1; stroke-width:0; } }
  .shine { opacity:0; }
  .play .shine { animation:sweep 1.1s ease-in-out 2.3s 1 forwards, sweep 1.1s ease-in-out 7s infinite; animation-composition:replace; }
  @keyframes sweep { 0% { transform:translateX(-120px) skewX(-20deg); opacity:1; } 100% { transform:translateX(330px) skewX(-20deg); opacity:1; } }

  /* chữ: wipe từ icon + trượt */
  .word { clip-path:inset(-10% 100% -10% 0); }
  .play .word { animation:wipe 1.1s var(--ease) 1.5s forwards; }
  @keyframes wipe { to { clip-path:inset(-10% -2% -10% 0); } }
  .word path { transform:translateX(-36px); opacity:0; transform-box:fill-box; }
  .play .word path { animation:slideR .9s var(--ease) forwards; animation-delay:calc(1.5s + var(--i) * .09s); }
  @keyframes slideR { to { transform:none; opacity:1; } }

  /* tagline */
  .tag > * { opacity:0; transform:translateY(10px); transform-box:fill-box; transform-origin:center; }
  .play .tag > * { animation:tagIn .6s var(--ease) forwards; animation-delay:calc(2.3s + var(--j) * .03s); }
  @keyframes tagIn { to { opacity:.7; transform:none; } }

  .hint { position:fixed; bottom:24px; left:0; right:0; text-align:center; font-size:12px; letter-spacing:.04em; color:rgba(255,255,255,.35); z-index:1; }

  @media (prefers-reduced-motion:reduce) {
    .play *,.play *::before { animation-duration:.01s !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
  }

  [data-part] { transform-box:fill-box; transform-origin:center; }
  body.bg-clear { background:transparent !important; }
  body.bg-clear .aurora, body.bg-clear .grid { display:none; }
  body.bg-clear .card { background:none; border-color:transparent; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
  body.bg-clear .card::before { display:none; }
  /* panel */
  .panel { position:fixed; top:16px; right:16px; z-index:10; width:272px; max-height:calc(100vh - 32px); overflow:auto;
           background:rgba(15,22,38,.82); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
           border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:12px 14px 14px; font-size:12px; color:#e6edf7;
           box-shadow:0 20px 50px -10px rgba(0,0,0,.6); cursor:default; }
  .panel.min .body { display:none; }
  .panel h2 { margin:0; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
  .panel h2 button { all:unset; cursor:pointer; padding:2px 8px; border-radius:6px; color:#9fb0c9; }
  .panel h2 button:hover { background:rgba(255,255,255,.08); color:#fff; }
  .panel fieldset { border:0; margin:12px 0 0; padding:10px 0 0; border-top:1px solid rgba(255,255,255,.08); }
  .panel legend { padding:0; font-weight:600; color:var(--cyan); font-size:11px; letter-spacing:.06em; text-transform:uppercase; float:left; width:100%; margin-bottom:6px; }
  .row { display:grid; grid-template-columns:34px 1fr 52px; gap:8px; align-items:center; margin:6px 0; clear:both; }
  .row label { color:#9fb0c9; }
  .row input[type=range] { width:100%; accent-color:var(--cyan); margin:0; }
  .row input[type=number] { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:6px; color:#fff; padding:3px 4px; font:inherit; text-align:right; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
  .actions button { font:inherit; color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:6px 10px; cursor:pointer; }
  .actions button:hover { background:rgba(255,255,255,.16); }
  .actions .primary { background:linear-gradient(135deg,var(--cyan),var(--blue)); border:0; color:#04101f; font-weight:600; }
  .check { display:flex; gap:8px; align-items:center; margin-top:12px; color:#cbd7ea; cursor:pointer; }
  .check input { accent-color:var(--cyan); }
</style>
</head>

<script>
  // đánh số thứ tự cho từng ký tự tagline để hiện lần lượt trái -> phải
  const tag = document.getElementById('tag');
  [...tag.children]
    .map(el => ({ el, x: el.getBBox().x }))
    .sort((a, b) => a.x - b.x)
    .forEach((o, i) => o.el.style.setProperty('--j', i));

  const stage = document.getElementById('stage');
  const logo = document.body;
  function play() {
    logo.classList.remove('play');
    void logo.getBoundingClientRect(); // restart animation
    logo.classList.add('play');
  }
  window.replayLogo = play;
  stage.addEventListener('click', play);
  play();
</script>

<div class="panel" id="panel">
  <h2>Tùy chỉnh logo <button id="pmin" title="Thu gọn">—</button></h2>
  <div class="body">
    <div id="groups"></div>
    <label class="check"><input type="checkbox" id="clear"> Nền trong suốt (xem trước)</label>
    <div class="actions">
      <button id="replay" class="primary">▶ Chạy lại</button>
      <button id="reset">Đặt lại</button>
      <button id="dl" title="Tải settings.json để dùng khi xuất video">Tải settings</button>
    </div>
  </div>
</div>

<script>
(() => {
  const GROUPS = [
    { key:'all',  label:'Toàn bộ logo', range:[-700,700,-450,450] },
    { key:'icon', label:'Icon',         range:[-300,300,-200,200] },
    { key:'word', label:'Chữ Reed',     range:[-300,300,-200,200] },
    { key:'tag',  label:'Tagline',      range:[-300,300,-200,200] },
  ];
  const DEF = () => Object.fromEntries([...GROUPS.map(g => [g.key, { x:0, y:0, s:100 }]), ['clear', false]]);
  const KEY = 'reed-logo-cfg';
  let cfg = DEF();
  try { Object.assign(cfg, window.__REED_CFG || JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  const svg = document.getElementById('logo');
  const stage = document.getElementById('stage');
  const glow = document.querySelector('.glow');
  const el = { all: stage, icon: svg.querySelector('[data-part=icon]'), word: svg.querySelector('[data-part=word]'), tag: svg.querySelector('[data-part=tag]') };

  function apply() {
    const k = svg.clientWidth / 856 || 1;
    for (const g of GROUPS) {
      const c = cfg[g.key], e = el[g.key];
      e.style.translate = c.x + 'px ' + c.y + 'px';
      e.style.scale = c.s / 100;
    }
    if (glow) { const c = cfg.icon; glow.style.translate = (c.x * k) + 'px ' + (c.y * k) + 'px'; glow.style.scale = c.s / 100; }
    document.body.classList.toggle('bg-clear', !!cfg.clear);
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  const wrap = document.getElementById('groups');
  const syncers = [];
  for (const g of GROUPS) {
    const fs = document.createElement('fieldset');
    fs.innerHTML = '<legend>' + g.label + '</legend>';
    [['x','X',g.range[0],g.range[1]], ['y','Y',g.range[2],g.range[3]], ['s','Cỡ %',10,300]].forEach(([p, lab, mn, mx]) => {
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<label>' + lab + '</label><input type="range" min="' + mn + '" max="' + mx + '" step="1"><input type="number" step="1">';
      const rng = r.children[1], num = r.children[2];
      const set = v => { v = Math.max(mn, Math.min(mx, +v || 0)); cfg[g.key][p] = v; rng.value = num.value = v; apply(); };
      rng.oninput = () => set(rng.value);
      num.onchange = () => set(num.value);
      syncers.push(() => { rng.value = num.value = cfg[g.key][p]; });
      fs.appendChild(r);
    });
    wrap.appendChild(fs);
  }
  const clear = document.getElementById('clear');
  clear.onchange = () => { cfg.clear = clear.checked; apply(); };
  const sync = () => { syncers.forEach(f => f()); clear.checked = !!cfg.clear; apply(); };

  document.getElementById('reset').onclick = () => { cfg = DEF(); sync(); };
  document.getElementById('replay').onclick = () => window.replayLogo && window.replayLogo();
  document.getElementById('pmin').onclick = e => { const p = document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent = p.classList.contains('min') ? '+' : '—'; };
  document.getElementById('dl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], { type:'application/json' }));
    a.download = 'settings.json'; a.click();
  };
  document.getElementById('panel').addEventListener('click', e => e.stopPropagation());
  window.addEventListener('resize', apply);
  sync();
})();
</script>
</body>
</html>
