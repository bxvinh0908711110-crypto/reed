<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reed</title>
<link rel="icon" type="image/svg+xml" href="reed-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0b; --muted:#77736d; --accent:#1b3bff; --leaf:#e4ffa4; --grey:#ececec;
  --bg:#ffffff;
}
*{box-sizing:border-box}
/* Cuộn hoàn toàn do JS điều khiển (goStep): tắt cuộn/quán tính gốc của trình duyệt để không xung đột với snap trên điện thoại */
html{scroll-behavior:auto;overflow:hidden;touch-action:none;overscroll-behavior:none}
.nbBody{touch-action:pan-y;overscroll-behavior:contain}
.hero{scroll-snap-align:start}
.snap{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start;scroll-snap-stop:always;pointer-events:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:18px 6vw;font-size:13px;letter-spacing:.06em;color:var(--muted);pointer-events:none}
.top b{font-weight:500}
.top .brand{display:flex;align-items:center;gap:9px}
.top .brand img{display:block;pointer-events:none}
.top .brandtext{display:flex;flex-direction:column;line-height:1.1}
.top .brandtext b{font-size:16px;font-weight:800;letter-spacing:.08em;color:var(--ink)}
.top .brandtext i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.top .right{display:flex;align-items:center;gap:14px;pointer-events:none}
.nbBtn{pointer-events:auto;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nbBtn b{background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;min-width:1.4em;text-align:center}
.nbBackdrop{position:fixed;inset:0;background:rgba(30,20,10,.32);z-index:48;opacity:0;transition:opacity .35s}
.nbBackdrop.show{opacity:1}
.nb{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:#fff;z-index:49;
  box-shadow:-24px 0 60px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
.nb.show{transform:translateX(0)}
.nbHead{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--grey)}
.nbHead h2{margin:0;font-size:18px;font-weight:800}
.nbHead button{border:0;background:var(--grey);width:32px;height:32px;border-radius:999px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.nbBody{flex:1;overflow-y:auto;padding:6px 22px 30px}
.nbGroup h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
.nbGroup:first-child h3{margin-top:16px}
.nbItem{padding:12px 0;border-bottom:1px solid var(--grey);cursor:pointer;
  opacity:0;transform:translateY(9px);animation:nbIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes nbIn{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.nbItem{animation:none;opacity:1;transform:none}}
.nbItem .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nbItem .base{font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--ink)}
.nbItem .row .spoiler{position:relative;display:inline-flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.nbItem .arrow{color:var(--muted);font-weight:400;font-size:13px}
.nbItem .up{color:var(--accent);font-weight:800;font-size:16px;letter-spacing:-.02em}
.nbItem .lv{font-size:11px;font-weight:800;background:var(--leaf);color:var(--accent);padding:2px 8px;border-radius:999px}
.nbItem .rm{position:relative;z-index:1}
/* Che sẵn đáp án bằng các hạt (canvas) lấy đúng từ pixel của chính chữ đó — nên đúng cỡ, đúng màu.
   Hạt trôi nổi lơ lửng khi chưa xem; rê chuột/chạm vào thì hạt bay hội tụ lại thành chữ, đồng thời
   bản gốc (.real) hiện rõ dần lên trên. Xem hàm nbBuildDust() ở phần script. */
.nbItem .row .spoiler .real{display:inline-flex;align-items:baseline;gap:7px;flex-wrap:wrap;opacity:0;transition:opacity .35s ease;position:relative;z-index:1}
.nbItem > .spoiler{display:block;position:relative;margin-top:4px}
.nbItem > .spoiler .real{opacity:0;transition:opacity .35s ease;position:relative;z-index:1}
.spoiler .dustlayer{position:absolute;inset:0;pointer-events:none;transition:opacity .35s ease}
.spoiler .dustlayer canvas{position:absolute}
.nbItem:hover .spoiler .real,.nbItem.show-lv .spoiler .real{opacity:1}
.nbItem:hover .spoiler .dustlayer,.nbItem.show-lv .spoiler .dustlayer{opacity:0}
.nbItem .meaning{font-size:13px;color:var(--muted);margin-top:4px}
.nbItem .ex{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.nbItem .topic{font-size:11px;color:var(--muted);margin-top:4px}
.nbItem .rm{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:4px}
.nbEmpty{color:var(--muted);font-size:14px;padding:50px 10px;text-align:center;line-height:1.6}
.foot .sv{border:1.5px solid var(--grey);background:#fff;color:var(--muted);
  width:34px;height:34px;padding:0;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;
  transition:opacity .2s ease,visibility .2s ease}
.foot .sv svg{display:block}
.foot .sv.on{background:var(--leaf);border-color:var(--leaf);color:var(--accent)}
.foot .sv[hidden]{display:none}

/* ---- Hero ---- */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 6vw;position:relative}
.hero h1{font-size:clamp(40px,8vw,120px);line-height:1.02;letter-spacing:-.045em;font-weight:800;margin:0 0 28px;max-width:11em}
.hero p{font-size:clamp(16px,1.6vw,22px);color:var(--muted);max-width:30em;margin:0;line-height:1.5}
.cue{position:absolute;left:6vw;bottom:9vh;font-size:14px;color:var(--muted);letter-spacing:.06em;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}

/* ---- Phrase (chữ nổi bật) ---- */
.ph,.ph2{background:color-mix(in srgb,var(--leaf) calc(var(--u,1)*100%),var(--grey));
  color:color-mix(in srgb,var(--accent) calc(var(--u,1)*100%),#141414);border-radius:.1em}
.ph,.ph2{font-weight:800;letter-spacing:-.04em}
.ph{display:inline-block;margin:0 .03em;position:relative;vertical-align:top;height:1.16em;line-height:1.16;
  padding:0 .14em;white-space:nowrap;cursor:pointer}
.ph .o{position:absolute;left:.14em;top:0;white-space:nowrap;opacity:0}
.ph2{padding:0 .1em}
.tk{white-space:nowrap}
.ph{background:none}
.ph .bg{position:absolute;left:0;top:0;bottom:0;border-radius:.1em;
  background:color-mix(in srgb,var(--leaf) calc(var(--u,1)*100%),var(--grey))}

/* ---- Passage ---- */
.passage{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100dvh;display:grid;grid-template-columns:1.2fr .8fr;
  gap:5vw;align-items:center;padding:0 6vw;overflow:hidden}
.left{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center}
.label{position:absolute;top:74px;left:0;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sents{display:grid;grid-template-columns:minmax(0,1fr);max-height:calc(100vh - 260px);max-height:calc(100dvh - 260px);overflow:hidden}
.sent{grid-area:1/1;opacity:0;pointer-events:none;will-change:opacity,transform}
.line{font-size:clamp(30px,4.5vw,66px);line-height:1.22;letter-spacing:-.035em;font-weight:500;color:#3b3b3b;margin:0}
.sent .line+.line{margin-top:16px}
.line.plain{font-size:clamp(22px,2.7vw,40px);color:var(--muted)}   /* câu không có cụm từ để học: thu nhỏ, bớt nổi bật vì không quan trọng bằng */
.cap{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-top:22px;min-height:28px;
  font-size:clamp(14px,1.3vw,18px);color:var(--muted);max-width:100%;overflow:hidden}
.cap b{color:var(--ink);font-weight:800;font-size:1.15em;flex:0 0 auto}
.cap span{font-weight:400;flex:1 1 12em;min-width:0;line-height:1.4}
.cap em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.05em;background:var(--leaf);color:var(--accent);
  padding:2px 9px;border-radius:999px;flex:0 0 auto}
.rcw{--rs:1}
.recap .line{font-size:calc(var(--rs) * clamp(22px,2.7vw,40px));line-height:1.4;letter-spacing:-.025em;font-weight:500}
.vi{margin:20px 0 0;font-size:clamp(14px,1.25vw,17px);color:var(--muted);line-height:1.55;max-width:34em}
.rcw{position:relative;transition:height .5s cubic-bezier(.3,.9,.3,1)}
.rl{position:absolute;left:0;top:0;width:100%;transition:opacity .28s ease,filter .28s ease,transform .28s ease}
.rcw[data-m=up] .base,.rcw[data-m=base] .up{opacity:0;filter:blur(3px);pointer-events:none}
.rcw[data-m=up] .base{transform:translateY(-6px)}
.rcw[data-m=base] .up{transform:translateY(6px)}
.rcw[data-m=up] .up,.rcw[data-m=base] .base{opacity:1;filter:none;transform:none;transition-duration:.45s;transition-delay:.18s}
.recap mark{font-weight:800;letter-spacing:-.04em;padding:0 .14em;border-radius:.1em;cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.recap mark.m0{background:var(--grey);color:#141414}
.recap mark.m1{background:var(--leaf);color:var(--accent)}
.tg button{outline:none}
.tg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tg{position:relative;display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.foot .tg[hidden]{display:none}
.tg .pill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--ink);border-radius:999px;z-index:0;
  transition:left .5s cubic-bezier(.3,.9,.3,1),width .5s cubic-bezier(.3,.9,.3,1)}
.tg button{position:relative;z-index:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;padding:8px 18px;cursor:pointer;color:var(--ink);transition:color .35s}
.tg button[aria-pressed=true]{color:#fff}
.foot{position:absolute;left:0;right:0;bottom:92px;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:3px;background:var(--grey);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.art{border:6px solid var(--accent);border-radius:36px;overflow:hidden;aspect-ratio:1/1;
  width:100%;max-height:72vh;justify-self:end;box-shadow:12px 12px 0 var(--leaf)}
.art{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.passage:not(.on) .art{opacity:.25;transform:scale(.96) translateY(10px)}
.label{transition:opacity .6s}
.passage:not(.on) .label{opacity:0}
.art svg{width:100%;height:100%;display:block}
/* ---- Khoá bài theo tiến trình ---- */
.passage.locked .stage>.left,.passage.locked .stage>.art{filter:blur(3px) grayscale(.3);pointer-events:none;user-select:none}
.lockOv{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  text-align:center;padding:0 10vw;background:rgba(255,255,255,.78);color:var(--muted)}
.lockOv[hidden]{display:none}
.lockOv svg{color:var(--muted)}
.lockOv b{font-size:18px;color:var(--ink);font-weight:800}
.lockOv span{font-size:13px}
/* ---- Player (dock): 1 hàng Lesson + picker cuộn dọc / 1 hàng cài đặt giọng-tốc độ, vuốt hoặc bấm chevron để đổi.
   Cỡ thu nhỏ lại gần bằng dock gọn trước đây (~56px) — bản 88px trước quá to so với phần còn lại của app. */
.player{position:fixed;z-index:40;left:50%;bottom:20px;transform:translateX(-50%);width:min(92vw,420px);
  height:56px;background:#090909;border-radius:28px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.28);touch-action:pan-y}
.player .viewport{width:100%;height:100%;overflow:hidden;position:relative}
.player .slider{width:100%;position:absolute;left:0;top:0;transition:transform .35s cubic-bezier(.22,.8,.25,1)}
.player.settings .slider{transform:translateY(-56px)}
.player .row,.player .settings-row{width:100%;height:56px;display:flex;align-items:center;padding:6px 10px}
.player .play{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:50%;background:#d9ff73;
  display:flex;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s ease;color:#151515}
.player .play:active{transform:scale(.92)}
.player .play svg{display:block}
.player .divider{width:1px;height:20px;background:rgba(255,255,255,.25);margin:0 9px;flex:0 0 1px}
.lesson-content{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;position:relative}
.lesson-title{color:#fff;font-size:13px;font-weight:700;line-height:1.1;white-space:nowrap}
.lesson-subtitle{margin-top:2px;color:#888;font-size:10px;white-space:nowrap}
.player .dots{display:flex;gap:3px;margin-top:3px}
.player .dots .dot{width:4px;height:4px;border-radius:50%;background:#454545;flex:0 0 4px}
.player .dots .dot.active{background:#fff}
.chevron-button{width:24px;height:24px;flex:0 0 24px;border:0;background:transparent;color:#777;
  display:flex;justify-content:center;align-items:center;cursor:pointer}
.chevron{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg);transition:transform .3s ease}
.player.settings .chevron{transform:rotate(225deg)}
.setting-group{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:2px;min-width:0}
.setting{width:34px;height:34px;flex:0 0 34px;border:0;border-radius:50%;background:transparent;color:#777;
  display:flex;justify-content:center;align-items:center;cursor:pointer;
  transition:background .2s ease,color .2s ease,transform .15s ease}
.setting:hover{background:rgba(255,255,255,.06)}
.setting:active{transform:scale(.9)}
.setting[aria-pressed=true]{background:#303034;color:#fff}
.setting .icon{width:18px;height:18px;fill:currentColor;flex:none}
.setting .speed-icon{width:18px;height:18px;flex:none}

/* Bấm giữ: không bôi chữ / hiện menu sao chép; bong bóng số nổi phía trên ngón tay */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.lesson-content,#lessonContent{touch-action:none}
#pickBubble{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);transform:translate(-50%,8px) scale(.85);
  width:46px;height:46px;border-radius:50%;background:rgba(14,14,14,.92);color:#fff;display:flex;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:0;transition:opacity .14s ease,transform .18s ease}
#pickBubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
#pickBubble b{font-size:20px;line-height:1;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#pickBubble.locked b{color:rgba(255,255,255,.35)}
/* ---- Lesson picker: kéo ngang chọn số bài (vật lý theo con trỏ), phủ kín player khi mở ---- */
.lesson-picker{position:absolute;inset:0;z-index:100;background:#191919;border-radius:28px;overflow:hidden;
  opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .18s ease,transform .22s ease}
.player.picker-open .lesson-picker{opacity:1;transform:scale(1);pointer-events:auto}
.picker-label{position:absolute;top:6px;left:0;right:0;text-align:center;color:rgba(255,255,255,.38);font-size:8px;
  letter-spacing:1.4px;z-index:30;pointer-events:none}
.number-picker{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.number-picker.dragging{cursor:grabbing}
.number-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;width:max-content;
  will-change:transform;user-select:none}
.number-spacer{width:calc(50% - 17px);min-width:calc(50% - 17px);height:1px;flex-shrink:0}
.lesson-number{width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:rgba(255,255,255,.23);font-size:13px;font-weight:400;
  transition:color .12s ease,background .12s ease,transform .12s ease;pointer-events:none}
.lesson-number .num{font:inherit}
.lesson-number .lk{display:none;color:rgba(255,255,255,.3)}
.lesson-number.near{color:rgba(255,255,255,.52)}
.lesson-number.active{color:#fff;background:#303035;font-size:14px;font-weight:600;transform:scale(1.08)}
.lesson-number.locked{color:rgba(255,255,255,.16)}
.lesson-number.locked .num{display:none}
.lesson-number.locked .lk{display:block}
.lesson-picker::before,.lesson-picker::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:20;pointer-events:none}
.lesson-picker::before{left:0;background:linear-gradient(to right,#191919 0%,rgba(25,25,25,.9) 35%,rgba(25,25,25,0) 100%)}
.lesson-picker::after{right:0;background:linear-gradient(to left,#191919 0%,rgba(25,25,25,.9) 35%,rgba(25,25,25,0) 100%)}
.number-picker::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(255,255,255,.08);pointer-events:none}

@media (max-width:480px){
  .player{width:calc(100vw - 24px);height:52px;border-radius:26px}
  .player .slider{transform:translateY(0)}
  .player.settings .slider{transform:translateY(-52px)}
  .player .row,.player .settings-row{height:52px;padding:5px 8px}
  .player .play{width:38px;height:38px;flex-basis:38px}
  .player .divider{margin:0 7px;height:18px}
  .lesson-title{font-size:12px}
  .lesson-subtitle{font-size:9px}
  .setting{width:30px;height:30px;flex-basis:30px}
  .setting .icon{width:16px;height:16px}
  .setting .speed-icon{width:16px;height:16px}
  .lesson-number{width:30px;flex-basis:30px;height:30px;font-size:11px}
  .lesson-number.active{font-size:12px}
  .number-spacer{width:calc(50% - 15px);min-width:calc(50% - 15px)}
}

@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;gap:3vh;align-content:start;padding-top:64px}
  .art{grid-row:1;aspect-ratio:16/9;max-height:26vh;justify-self:stretch;border-width:4px;border-radius:24px;box-shadow:8px 8px 0 var(--leaf)}
  .left{grid-row:2;height:auto;align-self:stretch}
  .label{top:0}
  /* Foot nằm trong luồng flex (không còn absolute) → vùng chữ + chú thích luôn dừng phía trên Sentence x/y, không đè nhau */
  .left{display:flex;flex-direction:column;justify-content:flex-start;min-height:0;min-width:0;max-width:100%}
  .sents,.foot{min-width:0;max-width:100%}
  .sents{margin-top:34px;flex:1 1 auto;min-height:0;max-height:none;align-content:center}
  .foot{position:static;flex:0 0 auto;margin-bottom:84px;padding-top:10px}
  /* Câu/đoạn dài trên màn hình hẹp: chữ nhỏ lại một chút để đỡ tràn dòng, và nếu vẫn dài
     quá thì tự cuộn bên trong thay vì đè lên thanh điều khiển cố định phía dưới. */
  .recap .line{font-size:calc(var(--rs) * clamp(15px,4vw,22px));line-height:1.5}
  .line{font-size:clamp(24px,7vw,66px)}
  .line.plain{font-size:clamp(16px,4.2vw,26px)}
}

/* ==================== Màn hình mở đầu (splash) ==================== */
#reed-splash{--navy:#00148c;--cyan:#2fd7fc;--ease:cubic-bezier(.16,1,.3,1);--s:1;
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--navy)}
#reed-splash.flying{pointer-events:none}

#reed-splash .mesh{position:absolute;inset:-25%;opacity:0;will-change:transform;
  background:

    radial-gradient(34% 34% at 78% 20%,rgba(47,215,252,.30),transparent 70%),
    radial-gradient(46% 40% at 70% 82%,rgba(30,60,255,.50),transparent 70%),
    radial-gradient(30% 30% at 16% 80%,rgba(47,215,252,.20),transparent 70%),

    var(--navy)}

  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0,#000 25%,transparent 80%);
          mask-image:radial-gradient(circle at 50% 50%,#000 0,#000 25%,transparent 80%)}
#reed-splash .lockup{position:relative;width:min(78vw,440px);height:auto;overflow:visible;transform:translateX(36.2%)}
#reed-splash .icon{fill:var(--cyan)}
#reed-splash .rbody,#reed-splash .rs{opacity:0}
#reed-splash .rs{transform-box:fill-box;transform-origin:100% 50%}
#reed-splash .wm path,#reed-splash .tag{fill:#fff;opacity:0}
#reed-splash .wm path{transform:translate(-46px,12px)}
#reed-splash .tag{transform:translateY(26px)}
#reed-splash.play::before{animation:rsGlow calc(1200ms*var(--s)) ease-out forwards}
#reed-splash.play .mesh{animation:rsMeshIn calc(900ms*var(--s)) ease-out forwards,rsDrift 9s ease-in-out infinite alternate}
#reed-splash.play .lockup{animation:rsSlide calc(700ms*var(--s)) var(--ease) calc(800ms*var(--s)) forwards}
#reed-splash.play .rs{animation:rsStreak calc(700ms*var(--s)) var(--ease) forwards}
#reed-splash.play .rs3{animation-delay:0ms}
#reed-splash.play .rs1{animation-delay:calc(90ms*var(--s))}
#reed-splash.play .rs2{animation-delay:calc(180ms*var(--s))}
#reed-splash.play .rbody{animation:rsWipe calc(400ms*var(--s)) cubic-bezier(.4,0,.2,1) calc(450ms*var(--s)) forwards}
#reed-splash.play .wm path{animation:rsLetter calc(600ms*var(--s)) var(--ease) forwards;
  animation-delay:calc((800ms + var(--i)*40ms)*var(--s))}
#reed-splash.play .tag{animation:rsRise calc(500ms*var(--s)) var(--ease) calc(1250ms*var(--s)) forwards}
@keyframes rsStreak{from{opacity:1;fill:#e8fbff;transform:translateX(calc(var(--fly,900)*-1px)) scaleX(7)}to{opacity:1;fill:#2fd7fc;transform:translateX(0) scaleX(1)}}
@keyframes rsWipe{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes rsSlide{to{transform:translateX(0)}}
@keyframes rsLetter{to{opacity:1;transform:translate(0,0)}}
@keyframes rsRise{to{opacity:1;transform:translateY(0)}}
@keyframes rsGlow{0%{opacity:0;transform:scale(.7)}50%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes rsFade{to{opacity:1}}
@keyframes rsMeshIn{to{opacity:1}}
@keyframes rsDrift{from{transform:translate3d(-3%,2%,0) rotate(0) scale(1.05)}to{transform:translate3d(3%,-2%,0) rotate(7deg) scale(1.18)}}
@media (prefers-reduced-motion:reduce){
  #reed-splash.play .mesh{animation:none;opacity:1}

  #reed-splash.play .rbody,#reed-splash.play .rs,#reed-splash.play .wm path,#reed-splash.play .tag{
    animation:rsFade 300ms forwards!important;transform:none;clip-path:none}
}

    const idx=[...t.matchAll(/\{(\d)\}/g)].map(m=>+m[1]);
    const steps=idx.map(i=>opts(pi,i).length-1);
    return {tpl:t,idx,steps};
  });
  /* Câu không có cụm nào để đổi thì không đáng có riêng một lượt cuộn: gộp nó vào câu
     có cụm gần nhất (đứng trước nếu đã có, không thì chờ gắn vào câu thật kế tiếp). */
  const slides=[]; let pending=[];
  raw.forEach(t=>{
    if(!t.idx.length) pending.push(t);
    else { slides.push({lines:[...pending,t]}); pending=[]; }
  });
  if(pending.length){ if(slides.length) slides[slides.length-1].lines.push(...pending); else slides.push({lines:pending}); }
  const sents = slides.map(sl=>{
    const idx=sl.lines.flatMap(l=>l.idx), steps=sl.lines.flatMap(l=>l.steps);
    const total=steps.reduce((a,b)=>a+b,0);
    return {lines:sl.lines,idx,steps,total,weight:1.6+total+(sl.lines.length-1)*0.9};
  });
  sents.push({recap:true,weight:2.2,idx:[],steps:[],total:0});
  return {sents};
});
const F = passages.map(()=>({}));       /* vị trí (số lẻ) hiện tại của từng cụm */
const recapMode = passages.map(()=> "up");

/* ---------- Dựng giao diện ---------- */
const recapHTML=(pi,mode)=>passages[pi].tpl.replace(/\{(\d)\}/g,(_,i)=>{
  const o=opts(pi,+i), up=mode==="up";
  return `<mark class="m${up?1:0}" data-p="${pi}" data-i="${i}" data-r="1">${up?o[o.length-1].w:o[0].w}</mark>`;
});
const tokHTML=(pi,tpl)=>tpl.split(/\s+/).map(w=>`<span class="tk">${w.replace(/\{(\d)\}/g,(_,i)=>phHTML(pi,+i))}</span>`).join(" ");
const phHTML=(pi,i)=>`<span class="ph" data-p="${pi}" data-i="${i}"><span class="bg"></span>${opts(pi,i).map(o=>`<span class="o">${o.w}</span>`).join("")}</span>`;

function build(){
  $("#main").innerHTML = passages.map((p,pi)=>{
    const sents = P[pi].sents.map((s,si)=> s.recap
      ? `<div class="sent recap" data-s="${si}"><div class="rcw" id="rc${pi}" data-m="up"><p class="line rl base">${recapHTML(pi,"base")}</p><p class="line rl up">${recapHTML(pi,"up")}</p></div></div>`
      : `<div class="sent" data-s="${si}">${s.lines.map(l=>`<p class="line${l.idx.length?"":" plain"}">${tokHTML(pi,l.tpl)}</p>`).join("")}<div class="cap"></div></div>`).join("");
    return `<section class="passage" data-p="${pi}"><div class="stage">
      <div class="left"><div class="label">${String(pi+1).padStart(2,"0")} · ${p.topic}</div>
        <div class="sents">${sents}</div>
        <div class="foot"><span class="pos"></span><div class="bar"><i></i></div><button class="sv" hidden aria-label="Save to vocabulary" aria-pressed="false">${BOOKMARK(false)}</button>
          <div class="tg" data-p="${pi}" hidden><i class="pill"></i><button data-m="base" aria-pressed="false">A1</button><button data-m="up" aria-pressed="true">A2</button></div></div></div>
      <div class="art">${scenes[p.scene].replace("<svg ",'<svg preserveAspectRatio="xMidYMid slice" ')}</div>
      <div class="lockOv" hidden><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><b>Lesson ${pi+1} is locked</b><span>Finish Lesson ${pi} to unlock it</span></div>
    </div></section>`;
  }).join("");
  P.forEach((pp,pi)=>{
    pp.el=$(`.passage[data-p="${pi}"]`); pp.bar=$(".bar i",pp.el); pp.posEl=$(".pos",pp.el); pp.sv=$(".foot .sv",pp.el); pp.svKey=null; pp.pin={};
    pp.tg=$(".foot .tg",pp.el);
    pp.lockOv=$(".lockOv",pp.el);
    const els=[...pp.el.querySelectorAll(".sent")];
    pp.sents.forEach((s,si)=>{
      s.el=els[si]; s.cap=$(".cap",s.el); s.capKey="";
      s.ph=[...s.el.querySelectorAll(".ph")];
    });
  });
}
function measure(){
  const rg=document.createRange();
  document.querySelectorAll(".ph").forEach(ph=>{
    ph._w=[...ph.querySelectorAll(".o")].map(o=>{ rg.selectNodeContents(o); return rg.getBoundingClientRect().width; });
    ph._floor=0;
  });
  stabilize();
}
/* Giữ số dòng ổn định: đo cách xuống dòng khi mọi cụm ở dạng DÀI NHẤT, rồi chốt các điểm xuống dòng đó bằng <br>.
   Nhờ vậy mỗi dòng luôn gồm đúng những từ ấy ở mọi trạng thái; nền vẫn ôm sát chữ, không chừa khoảng trống. */
function stabilize(){
  P.forEach(pp=>pp.sents.forEach(s=>{
    if(s.recap||!s.ph.length) return;
    const line=s.ph[0].closest(".line");
    line.querySelectorAll("br.fb").forEach(b=>b.remove());
    s.ph.forEach(ph=>{ ph._floor=Math.ceil(Math.max(...ph._w)); ph.style.width="calc("+ph._floor+"px + .28em)"; });
    const lh=parseFloat(getComputedStyle(line).lineHeight), top0=line.getBoundingClientRect().top;
    let prev=0;
    line.querySelectorAll(".tk").forEach(t=>{
      const row=Math.round((t.getClientRects()[0].top-top0)/lh);
      if(row>prev){ const br=document.createElement("br"); br.className="fb"; t.before(br); prev=row; }
    });
    s.ph.forEach(ph=>{ ph._floor=0; setPhrase(ph, ph._f ?? 0); });
  }));
}
function layout(){
  const vh=innerHeight;
  P.forEach(pp=>{
    let acc=0;
    pp.sents.forEach(s=>{ s.a=acc*UNIT*vh; acc+=s.weight; s.b=acc*UNIT*vh; });
    pp.total=acc*UNIT*vh;
    pp.el.style.height=(pp.total+vh)+"px";
    /* vùng chữ đã hiện rõ của từng câu + các điểm dừng (snap) tại mỗi trạng thái đã đổi xong */
    const ramp=RAMP*UNIT*vh, pad=.08*UNIT*vh, last=pp.sents.length-1, ys=[];
    pp.sents.forEach((s,si)=>{
      s.lo=s.a+(si>0?ramp:0)+pad; s.hi=s.b-(si<last?ramp:0)-pad;
      if(s.recap){ ys.push(pp.total-1); return; }
      const n=Math.max(s.total,0);
      if(n===0) ys.push((s.lo+s.hi)/2);
      else for(let m=0;m<=n;m++) ys.push(s.lo+(s.hi-s.lo)*m/n);
    });
    pp.el.querySelectorAll(".snap").forEach(e=>e.remove());
    ys.forEach(y=>{ const d=document.createElement("i"); d.className="snap"; d.style.top=Math.round(y)+"px"; pp.el.appendChild(d); });
  });
  refreshLocks();   /* vị trí các bài đổi theo layout -> tính lại ranh giới khoá */
}

/* ---------- Cập nhật khi cuộn ---------- */
function setPhrase(ph,f){
  const w=ph._w, n=w.length, lo=Math.min(Math.floor(f),n-1), hi=Math.min(lo+1,n-1), fr=f-lo;
  const X=w[lo]+(w[hi]-w[lo])*fr;
  ph.style.width=`calc(${Math.max(X,ph._floor||0)}px + .28em)`;                 /* chỗ chiếm trong dòng */
  ph.querySelector(".bg").style.width=`calc(${X}px + .28em)`;                     /* nền bám sát chữ hiện tại */
  ph.style.setProperty("--u", n>1 ? f/(n-1) : 1);
  ph.querySelectorAll(".o").forEach((o,j)=>{
    const d=f-j, ad=Math.abs(d);
    o.style.opacity=clamp(1.15-ad*1.7);                       /* từ cũ tan trước, từ mới hiện sau -> không chồng chữ */
    o.style.transform=`translateY(${-d*.42}em)`;             /* trượt lên như con lăn */
    o.style.filter=ad<.01?"none":`blur(${(ad*5).toFixed(2)}px)`;
  });
}
let active={pi:0,si:0}, live=[], raf=0, lastT=0;

/* ---------- Mở khóa bài theo tiến trình: cuộn hết 1 bài (tới trang tổng kết) mới mở bài kế tiếp,
   tránh việc cuộn ào ào bỏ qua bài. Trạng thái lưu localStorage nên lần sau vào lại không bị khoá lại. */
const UNLOCK_KEY="reed_unlocked";
function loadUnlocked(){
  try{ const n=+localStorage.getItem(UNLOCK_KEY); return n>=1?Math.min(n,passages.length):1; }catch(e){ return 1; }
}
let unlockedCount=loadUnlocked(), lockBoundY=Infinity;
function saveUnlocked(){ try{ localStorage.setItem(UNLOCK_KEY,String(unlockedCount)); }catch(e){} }
function refreshLocks(){
  P.forEach((pp,pi)=>{
    const locked=pi>=unlockedCount;
    pp.el.classList.toggle("locked",locked);
    if(pp.lockOv) pp.lockOv.hidden=!locked;
  });
  lockBoundY = unlockedCount<passages.length
    ? P[unlockedCount].el.getBoundingClientRect().top+scrollY+P[unlockedCount].sents[0].lo   /* khớp đúng 1 điểm neo (snap) đầu bài khoá, để trình duyệt không tự "nảy" lệch chỗ */
    : Infinity;
  numberEls.forEach((it,i)=>it.classList.toggle("locked",i>=unlockedCount));
}
function unlockUpTo(n){
  if(n>unlockedCount && n<=passages.length){ unlockedCount=n; saveUnlocked(); refreshLocks(); }
}
function jumpToLesson(pi){
  if(pi<0||pi>=unlockedCount) return;
  /* nhắm đúng điểm neo (snap) đầu bài, không nhắm mép trên thô — mép trên trùng ranh giới 2 bài
     nên trình duyệt có thể tự "nảy" ngược về điểm neo cuối bài trước đó thay vì bài mong muốn. */
  const y=P[pi].el.getBoundingClientRect().top+scrollY+P[pi].sents[0].lo;
  /* nhảy tức thì + fade nhẹ, không cuộn qua từng bước của các bài ở giữa */
  let ov=$("#fadeOv");
  if(!ov){ ov=document.createElement("div"); ov.id="fadeOv";
    ov.style.cssText="position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .14s ease;background:var(--bg)";
    document.body.appendChild(ov); }
  ov.style.opacity=1;
  setTimeout(()=>{ scrollTo(0,y); requestAnimationFrame(()=>requestAnimationFrame(()=>{ ov.style.opacity=0; })); },150);
}
/* ---------- Player: hàng Lesson (+ picker kéo ngang chọn bài) / hàng cài đặt giọng-tốc độ ---------- */
const player=$("#player"), lessonContent=$("#lessonContent"), lessonTitleEl=$("#lessonTitle"), lessonSubtitleEl=$("#lessonSubtitle");
const numberPicker=$("#numberPicker"), numberTrack=$("#numberTrack");
let dotEls=[], numberEls=[];

function buildPlayer(){
  const dotsWrap=$("#dots");
  dotsWrap.innerHTML = passages.map(()=>`<span class="dot"></span>`).join("");
  dotEls=[...dotsWrap.children];
  numberTrack.innerHTML = `<div class="number-spacer"></div>` + passages.map((p,i)=>
    `<div class="lesson-number" data-i="${i}"><svg class="lk" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span class="num">${String(i+1).padStart(2,"0")}</span></div>`
  ).join("") + `<div class="number-spacer"></div>`;
  numberEls=[...numberTrack.querySelectorAll(".lesson-number")];
}
function updatePlayerUI(){
  lessonTitleEl.textContent=`Lesson ${active.pi+1}`;
  lessonSubtitleEl.textContent=passages[active.pi].topic;
  dotEls.forEach((d,i)=>d.classList.toggle("active",i===active.pi));
}

/* Picker kéo ngang: vị trí theo vật lý con trỏ (không dùng scroll-snap có sẵn), snap về số gần nhất khi thả tay */
let heldPointer=null, handoff=false;
let pickerIndex=0, pickerDragging=false, pStartX=0, pStartOffset=0, pCurOffset=0;
function centerOffset(i){ const el=numberEls[i]; return numberPicker.clientWidth/2-(el.offsetLeft+el.offsetWidth/2); }
function updatePickerStyles(){
  const bb=$("#pickBubble"); if(bb){ bb.querySelector("b").textContent=String(pickerIndex+1).padStart(2,"0"); bb.classList.toggle("locked",pickerIndex>=unlockedCount); }
  numberEls.forEach((el,i)=>{
    el.classList.remove("active","near");
    if(i===pickerIndex) el.classList.add("active");
    if(Math.abs(i-pickerIndex)===1) el.classList.add("near");
  });
}
function moveToLesson(i,animate){
  i=Math.max(0,Math.min(numberEls.length-1,i));
  pickerIndex=i;
  const target=centerOffset(i);
  numberTrack.style.transition=animate?"transform .22s cubic-bezier(.22,.8,.25,1)":"none";
  numberTrack.style.transform=`translateX(${target}px)`;
  pCurOffset=target;
  updatePickerStyles();
}
function findClosestNumber(){
  const center=numberPicker.clientWidth/2;
  let closest=0, dmin=1e9;
  numberEls.forEach((el,i)=>{
    const ic=el.offsetLeft+el.offsetWidth/2+pCurOffset, d=Math.abs(center-ic);
    if(d<dmin){ dmin=d; closest=i; }
  });
  pickerIndex=closest; updatePickerStyles();
}
function openPicker(){
  player.classList.remove("settings");
  $("#pickBubble").classList.add("on");
  if(window.getSelection) getSelection().removeAllRanges();
  /* đang giữ ngón: chuyển luôn quyền kéo sang picker để trượt được mà không cần nhấc tay */
  if(heldPointer){ try{ numberPicker.setPointerCapture(heldPointer.id); }catch(_){}
    pickerDragging=true; pStartX=heldPointer.x; pStartOffset=0; numberPicker.classList.add("dragging"); handoff=true; }
  pickerIndex=active.pi;
  player.classList.add("picker-open");
  requestAnimationFrame(()=>{ moveToLesson(active.pi,false); if(handoff){ pStartOffset=pCurOffset; handoff=false; } });
}
function closePicker(){ player.classList.remove("picker-open"); $("#pickBubble").classList.remove("on"); }

numberPicker.addEventListener("pointerdown",e=>{
  pickerDragging=true; pStartX=e.clientX; pStartOffset=pCurOffset;
  numberPicker.classList.add("dragging");
  numberPicker.setPointerCapture(e.pointerId);
  numberTrack.style.transition="none";
});
numberPicker.addEventListener("pointermove",e=>{
  if(!pickerDragging) return;
  let next=pStartOffset+(e.clientX-pStartX);
  const maxOffset=centerOffset(0), minOffset=centerOffset(numberEls.length-1);
  next=Math.max(minOffset,Math.min(maxOffset,next));
  pCurOffset=next;
  numberTrack.style.transform=`translateX(${next}px)`;
  findClosestNumber();
});
function finishPicker(){
  heldPointer=null;
  if(!pickerDragging) return;
  pickerDragging=false;
  numberPicker.classList.remove("dragging");
  moveToLesson(pickerIndex,true);
  /* Bài khoá: cho thấy được (nằm giữa, có icon ổ khoá) nhưng không cho chọn — picker vẫn mở, kéo sang bài khác để thử lại */
  if(pickerIndex<unlockedCount) setTimeout(()=>{ jumpToLesson(pickerIndex); closePicker(); },180);
}
numberPicker.addEventListener("pointerup",finishPicker);
numberPicker.addEventListener("pointercancel",finishPicker);

/* Bấm giữ 500ms vào tên Lesson để mở picker; nhả sớm hoặc vuốt thì huỷ */
let pressTimer=null, pressX=0, pressY=0;
lessonContent.addEventListener("pointerdown",e=>{
  if(player.classList.contains("picker-open")) return;
  pressX=e.clientX; pressY=e.clientY; heldPointer={id:e.pointerId,x:e.clientX};
  pressTimer=setTimeout(openPicker,420);
});
lessonContent.addEventListener("pointermove",e=>{
  if(heldPointer) heldPointer.x=e.clientX;
  if(Math.abs(e.clientX-pressX)>10||Math.abs(e.clientY-pressY)>10) clearTimeout(pressTimer);
});
lessonContent.addEventListener("contextmenu",e=>e.preventDefault());
player.addEventListener("contextmenu",e=>e.preventDefault());
lessonContent.addEventListener("pointerup",()=>{ clearTimeout(pressTimer); heldPointer=null; });
lessonContent.addEventListener("pointercancel",()=>{ clearTimeout(pressTimer); heldPointer=null; });

document.addEventListener("keydown",e=>{
  if(!player.classList.contains("picker-open")) return;
  if(e.key==="ArrowLeft") moveToLesson(pickerIndex-1,true);
  if(e.key==="ArrowRight") moveToLesson(pickerIndex+1,true);
  if(e.key==="Enter" && pickerIndex<unlockedCount){ jumpToLesson(pickerIndex); closePicker(); }
});
addEventListener("resize",()=>{ if(player.classList.contains("picker-open")) moveToLesson(pickerIndex,false); });

/* Bấm chevron hoặc vuốt dọc trên player đổi giữa 2 trang (Lesson / Cài đặt) */
$("#openSettings").addEventListener("click",()=>player.classList.add("settings"));
$("#closeSettings").addEventListener("click",()=>player.classList.remove("settings"));
let swipeY=0, swiping=false;
player.addEventListener("touchstart",e=>{
  if(player.classList.contains("picker-open")) return;
  swipeY=e.touches[0].clientY; swiping=true;
},{passive:true});
player.addEventListener("touchend",e=>{
  if(!swiping) return; swiping=false;
  const d=e.changedTouches[0].clientY-swipeY;
  if(d<-30) player.classList.add("settings");
  if(d>30) player.classList.remove("settings");
},{passive:true});

/* Dựng nội dung chú thích (từ / cấp độ / nghĩa) cho câu s, dùng chung giữa update() (theo cuộn)
   và việc bấm/chạm trực tiếp vào cụm từ (nhảy thẳng tới một mức mà không cần cuộn đúng chỗ). */
function renderCap(s,pi,i,j){
  const o=opts(pi,i), h=passages[pi].hl[i], key=i+":"+j;
  if(key!==s.capKey){ s.capKey=key; s.cap.innerHTML=`<b>${o[j].w}</b><em>${o[j].lv}</em><span>${j>0?h.vn:"original phrase"}</span>`; }
  return h;
}
function renderSave(pp,pi,i,h){
  const svKey=pi+":"+i;
  if(pp.svKey!==svKey){
    pp.svKey=svKey;
    const saved=nbHasPair(h.o,h.u);
    pp.sv.dataset.pi=pi; pp.sv.dataset.i=i;
    pp.sv.classList.toggle("on",saved);
    pp.sv.setAttribute("aria-pressed",saved);
    pp.sv.setAttribute("aria-label",saved?"Remove from vocabulary":"Save to vocabulary");
    pp.sv.innerHTML=BOOKMARK(saved);
    pp.sv.hidden=false;
  }
}

/* Từ vị trí cuộn -> trạng thái ĐÍCH (rời rạc). Hiệu ứng chạy theo thời gian nên luôn mượt dù cuộn nhanh hay snap. */
/* ---- Mỗi lần vuốt/lăn/bấm phím = đúng 1 bước (cuộn mạnh cũng chỉ tính 1), không dùng độ trễ ---- */
let stepping=false, wheelQuietT=0, wheelLocked=false;
function snapYs(){ return [...document.querySelectorAll(".snap")].map(e=>e.getBoundingClientRect().top+scrollY).sort((a,b)=>a-b); }
function goStep(dir){
  if(stepping) return;
  const ys=snapYs(), y=scrollY;
  const t = dir>0 ? ys.find(v=>v>y+2) : [...ys].reverse().find(v=>v<y-2);
  if(t===undefined || (dir>0 && t>lockBoundY+1)) return;
  stepping=true; setTimeout(()=>{ stepping=false; },900);   /* an toàn: không bao giờ kẹt khoá nếu rAF bị trình duyệt tạm dừng */
  const from=y, d=t-from, T=380, t0=performance.now(), root=document.documentElement;
  (function f(now){
    const k=Math.min(1,(now-t0)/T), e=1-Math.pow(1-k,3);
    scrollTo(0,from+d*e);
    if(k<1) requestAnimationFrame(f);
    else { scrollTo(0,t); stepping=false; }
  })(t0);
}
function ownScroller(el){
  for(;el&&el.nodeType===1&&el!==document.body;el=el.parentElement){
    if(el.closest&&el.id==="player") return true;
    const o=getComputedStyle(el).overflowY;
    if((o==="auto"||o==="scroll")&&el.scrollHeight>el.clientHeight+1) return true;
  }
  return false;
}
addEventListener("wheel",e=>{
  if(e.ctrlKey||Math.abs(e.deltaY)<Math.abs(e.deltaX)||ownScroller(e.target)) return;
  e.preventDefault();
  clearTimeout(wheelQuietT); wheelQuietT=setTimeout(()=>{ wheelLocked=false; },160);   /* cả chuỗi lăn/quán tính trackpad = 1 cử chỉ */
  if(wheelLocked||Math.abs(e.deltaY)<3) return;
  wheelLocked=true; goStep(e.deltaY>0?1:-1);
},{passive:false});
let tY=null, tX=0, tOwn=false, swipeAt=0;
/* iOS vẫn có thể bắn "click" sau khi vuốt: nuốt nó để không đổi từ/cuộn ngược ngoài ý muốn */
document.addEventListener("click",e=>{ if(performance.now()-swipeAt<600){ e.stopImmediatePropagation(); e.preventDefault(); } },true);
addEventListener("touchstart",e=>{ tY=e.touches[0].clientY; tX=e.touches[0].clientX; tOwn=ownScroller(e.target); },{passive:true});
addEventListener("touchmove",e=>{ if(!tOwn && tY!==null && e.cancelable) e.preventDefault(); },{passive:false});
addEventListener("touchend",e=>{
  if(tY===null||tOwn){ tY=null; return; }
  const dy=tY-e.changedTouches[0].clientY, dx=tX-e.changedTouches[0].clientX; tY=null;
  if(Math.abs(dy)>24 && Math.abs(dy)>Math.abs(dx)){ swipeAt=performance.now(); goStep(dy>0?1:-1); }
});
addEventListener("keydown",e=>{
  if(e.target.closest?.("button,input,textarea,select")||e.altKey||e.ctrlKey||e.metaKey) return;
  const k=e.key; let dir=0;
  if(k==="ArrowDown"||k==="PageDown"||(k===" "&&!e.shiftKey)) dir=1;
  else if(k==="ArrowUp"||k==="PageUp"||(k===" "&&e.shiftKey)) dir=-1;
  if(dir){ e.preventDefault(); goStep(dir); }
});
function update(){
  if(scrollY>lockBoundY){ scrollTo(0,lockBoundY); return; }   /* chặn cuộn vào bài chưa mở khoá */
  const vh=innerHeight;
  let act=null; live=[];
  P.forEach((pp,pi)=>{
    const r=pp.el.getBoundingClientRect();
    if(r.bottom<-vh||r.top>2*vh) return;
    live.push(pp);
    const pos=clamp(-r.top,0,pp.total), last=pp.sents.length-1;
    let cur=pp.sents.findIndex(s=>pos<s.b); if(cur<0) cur=last;
    if(pp.cur!==cur) pp.pin={};   /* đổi câu: bỏ ghim thủ công (nếu có) của câu cũ, câu mới luôn theo đúng vị trí cuộn */
    let curVocab=null;   /* mục từ vựng của câu đang active — nút Save đọc từ đây, không còn nằm trong .cap */
    pp.sents.forEach((s,si)=>{
      s.tgtOp = si===cur ? 1 : 0;
      s.el.style.pointerEvents=s.tgtOp===1?"auto":"none";   /* đặt ngay ở đây (không chờ tick()) để đúng cả khi rAF bị trình duyệt tạm hoãn, ví dụ tab/khung xem đang ẩn */
      if(!s.init){ s.init=true; s.op=s.tgtOp; }
      if(s.recap){ s.ph.forEach(ph=>{ ph._t=recapMode[pi]==="up"?1:0; if(ph._f===undefined) ph._f=ph._t; }); return; }
      if(!s.idx.length){ s.cap.innerHTML=""; s.capKey=""; return; }   /* câu không đổi giữa hai mức: không có chú thích */
      const u=clamp((pos-s.lo)/(s.hi-s.lo))*s.total, ru=Math.round(u);
      let cum=0, capK=-1;
      s.idx.forEach((i,k)=>{
        const n1=s.steps[k], scrollF=clamp(ru-cum,0,n1), ph=s.ph[k];
        const f = pp.pin[i]!==undefined ? pp.pin[i] : scrollF;   /* cụm vừa bấm để "ghim" ở 1 mức thì giữ nguyên, không để cuộn ghi đè ngay */
        ph._t=f; if(ph._f===undefined) ph._f=f;
        F[pi][i]=f;
        if(capK<0 && ru<=cum+n1) capK=k;
        cum+=n1;
      });
      if(capK<0) capK=s.idx.length-1;
      const i=s.idx[capK], j=F[pi][i]||0;
      const h=renderCap(s,pi,i,j);
      if(si===cur) curVocab={i,h};
    });
    pp.bar.style.width=(pos/pp.total*100)+"%";
    pp.posEl.textContent=cur<last?`Sentence ${cur+1}/${last}`:"Recap";
    /* Cụm A1/A2 của trang tổng kết: 1 nút duy nhất, cố định trong .foot thay vì bám theo đoạn văn recap
       (đoạn văn đổi chiều cao giữa 2 mức nên vị trí sẽ nhảy nếu để nó bám theo). */
    const onRecap=cur===last;
    if(onRecap && pi+1<passages.length && unlockedCount<pi+2) unlockUpTo(pi+2);   /* cuộn hết tới trang tổng kết: mở khoá bài kế tiếp */
    if(onRecap && pp.tg.hidden){ pp.tg.hidden=false; movePill(pp.tg); }
    else if(!onRecap) pp.tg.hidden=true;
    pp.posEl.hidden=onRecap; pp.bar.parentElement.hidden=onRecap;
    pp.cur=cur;
    /* Nút Save: 1 nút duy nhất, cố định trong .foot — chỉ đổi data-pi/data-i và trạng thái đã lưu,
       không còn dựng lại theo từng câu nên vị trí trên màn hình luôn không đổi. */
    if(curVocab){
      renderSave(pp,pi,curVocab.i,curVocab.h);
    } else if(pp.svKey!==null){
      pp.svKey=null; pp.sv.hidden=true;
    }
    const on=r.top<=vh*.5 && r.bottom>vh*.5;
    pp.el.classList.toggle("on",on);
    if(on) act={pi,si:cur};
  });
  if(act){ active=act; }
  updatePlayerUI();
  playBtns.forEach(b=>b.setAttribute("aria-label", P[active.pi].sents[active.si].recap ? "Play whole passage" : "Play sentence"));
  if(!raf){ lastT=0; raf=requestAnimationFrame(tick); }
}

/* Vòng lặp hiệu ứng: từ trượt/mờ, câu tan trước rồi câu mới hiện sau */
function tick(t){
  const dt=Math.min(64,lastT?t-lastT:16); lastT=t;
  const kf=1-Math.exp(-dt/150), ko=1-Math.exp(-dt/90);
  let busy=false;
  live.forEach(pp=>{
    pp.sents.forEach(s=>{
      let others=0; pp.sents.forEach(x=>{ if(x!==s) others=Math.max(others,x.op); });
      const tgt = (s.tgtOp===1 && others>.1) ? 0 : s.tgtOp;
      const d=tgt-s.op;
      if(Math.abs(d)>.004){ s.op+=d*ko; busy=true; } else s.op=tgt;
      s.el.style.opacity=s.op;
      s.el.style.transform=`translateY(${(1-s.op)*16}px)`;
      s.el.style.pointerEvents=s.tgtOp===1?"auto":"none";   /* theo Ý ĐỊNH (câu đang active), không theo độ mờ hiện tại — tránh việc câu vừa mờ đi vẫn lỡ hứng cú chạm trong lúc chuyển cảnh */
      if(s.op<=.01) return;
      s.ph.forEach(ph=>{
        if(ph._start && t<ph._start){ busy=true; return; }
        const e=ph._t-ph._f;
        if(Math.abs(e)>.002){ ph._f+=e*kf; busy=true; } else ph._f=ph._t;
        setPhrase(ph,ph._f);
      });
    });
  });
  raf = busy ? requestAnimationFrame(tick) : 0;
}
let ticking=false;
addEventListener("scroll",()=>{ if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;update()})} },{passive:true});
addEventListener("resize",()=>{ layout(); measure(); movePills(); update(); });
/* Trình duyệt di động ẩn/hiện thanh địa chỉ làm innerHeight đổi liên tục mà không phải lúc nào
   cũng bắn sự kiện "resize" — nghe thêm visualViewport để tính lại kịp thời, tránh chữ/nút bị
   lệch khỏi vị trí đã tính trước đó (và vô tình che mất nút bấm bên dưới). */
if(window.visualViewport){
  let vvT=0;
  const onVV=()=>{ clearTimeout(vvT); vvT=setTimeout(()=>{ layout(); measure(); movePills(); update(); },80); };
  visualViewport.addEventListener("resize",onVV);
  visualViewport.addEventListener("scroll",onVV);
}
/* Rời tab rồi quay lại: trình duyệt tạm ngưng/giảm tần suất rAF khi tab ẩn, nên cờ "ticking" ở trên
   có thể bị treo (đang chờ một rAF từ lúc còn ẩn) khiến lần cuộn đầu tiên sau khi quay lại như bị đơ.
   Chủ động đồng bộ lại ngay khi tab active trở lại thay vì thụ động chờ rAF cũ. */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  ticking=false; lastT=0; update();
});

function nbRenderList(){

  const infoHTML=it=>`<div class="meaning">${it.meaning}</div><div class="ex">\u201c${it.example}\u201d</div>`;
  let n=0;   /* th\u1ee9 t\u1ef1 chung xuy\u00ean su\u1ed1t c\u00e1c nh\u00f3m, \u0111\u1ec3 hi\u1ec7u \u1ee9ng xu\u1ea5t hi\u1ec7n ch\u1ea1y n\u1ed1i ti\u1ebfp t\u1eeb tr\u00ean xu\u1ed1ng */
  body.innerHTML=order.map(cat=>{

/* ---------- H\u1ea1t "c\u00e1t" tr\u00f4i n\u1ed5i cho s\u1ed5 tay: l\u1ea5y pixel th\u1eadt c\u1ee7a ch\u1eef (\u0111\u00fang font/m\u00e0u \u0111ang d\u00f9ng),
   bi\u1ebfn th\u00e0nh c\u00e1c h\u1ea1t nh\u1ecf bay l\u01a1 l\u1eedng; r\u00ea chu\u1ed9t/ch\u1ea1m v\u00e0o c\u1ee5m t\u1eeb \u0111\u00f3 th\u00ec h\u1ea1t bay h\u1ed9i t\u1ee5 l\u1ea1i. ---------- */
let dustRAF=0, dustFields=[];
function nbCancelDust(){ if(dustRAF) cancelAnimationFrame(dustRAF); dustRAF=0; dustFields=[]; }
function dustDrawNode(ctx,node,w,h){
  const cs=getComputedStyle(node);
  ctx.clearRect(0,0,w,h);
  if(node.classList.contains("lv")){
    const r=h/2;
    ctx.fillStyle=cs.backgroundColor;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.arcTo(w,0,w,h,r); ctx.arcTo(w,h,0,h,r); ctx.arcTo(0,h,0,0,r); ctx.arcTo(0,0,w,0,r);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=cs.color; ctx.font=`${cs.fontWeight} ${cs.fontSize} Inter, sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(node.textContent, w/2, h/2+1);
    return;
  }
  ctx.fillStyle=cs.color;
  ctx.font=`${cs.fontStyle==="italic"?"italic ":""}${cs.fontWeight} ${cs.fontSize} Inter, sans-serif`;
  ctx.textBaseline="alphabetic";
  const fs=parseFloat(cs.fontSize)||13, lh=parseFloat(cs.lineHeight)||fs*1.3;
  const words=node.textContent.split(" "); const lines=[]; let line="";
  words.forEach(word=>{
    const test=line?line+" "+word:word;
    if(w>0 && ctx.measureText(test).width>w && line){ lines.push(line); line=word; } else line=test;
  });
  lines.push(line);
  lines.forEach((ln,i)=>ctx.fillText(ln,0,fs*0.82+i*lh));
}
function dustSample(ctx,w,h){
  let img; try{ img=ctx.getImageData(0,0,w,h).data; }catch{ return []; }
  const out=[];
  for(let py=0;py<h;py+=2) for(let px=0;px<w;px+=2){
    const idx=(py*w+px)*4, a=img[idx+3];
    if(a>50 && Math.random()>0.25){
      out.push({ox:px,oy:py,x:px+(Math.random()-0.5)*14,y:py+(Math.random()-0.5)*14,vx:0,vy:0,
        color:`rgba(${img[idx]},${img[idx+1]},${img[idx+2]},0.9)`,
        size:Math.random()*1.6+0.7, ws:Math.random()*1.1+0.4, maxD:Math.random()*10+6});
    }
  }
  return out;
}
function nbBuildDust(){
  nbCancelDust();
  document.querySelectorAll("#nbBody .spoiler").forEach(sp=>{
    const real=sp.querySelector(".real"), item=sp.closest(".nbItem"); if(!real||!item) return;
    const targets=[...real.querySelectorAll(".arrow,.up,.lv,.meaning,.ex")]; if(!targets.length) return;
    const host=document.createElement("div"); host.className="dustlayer"; sp.appendChild(host);
    const pr=real.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    targets.forEach(node=>{
      const rr=node.getBoundingClientRect(), w=Math.max(1,Math.ceil(rr.width)), h=Math.max(1,Math.ceil(rr.height));
      const cv=document.createElement("canvas");
      cv.width=Math.ceil(w*dpr); cv.height=Math.ceil(h*dpr);
      cv.style.left=(rr.left-pr.left).toFixed(1)+"px"; cv.style.top=(rr.top-pr.top).toFixed(1)+"px";
      cv.style.width=w+"px"; cv.style.height=h+"px";
      host.appendChild(cv);
      const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.scale(dpr,dpr);
      dustDrawNode(ctx,node,w,h);
      const particles=dustSample(ctx,w,h);
      ctx.clearRect(0,0,w,h);
      dustFields.push({item,ctx,w,h,particles});
    });
  });
  if(dustFields.length) dustRAF=requestAnimationFrame(dustTick);
}
function dustTick(){
  dustFields.forEach(f=>{
    const hovered=f.item.matches(":hover")||f.item.classList.contains("show-lv");
    f.ctx.clearRect(0,0,f.w,f.h);
    f.particles.forEach(p=>{
      const dx=p.ox-p.x, dy=p.oy-p.y, dist=Math.hypot(dx,dy);
      if(!hovered){
        p.vx+=(Math.random()-0.5)*p.ws; p.vy+=(Math.random()-0.5)*p.ws;
        if(dist>p.maxD){ p.vx+=(dx/dist)*0.4; p.vy+=(dy/dist)*0.4; }
        p.vx*=0.88; p.vy*=0.88;
      } else {
        p.vx+=dx*0.2; p.vy+=dy*0.2; p.vx*=0.7; p.vy*=0.7;
      }
      p.x+=p.vx; p.y+=p.vy;
      f.ctx.fillStyle=p.color; f.ctx.fillRect(p.x,p.y,p.size,p.size);
    });
  });
  dustRAF=requestAnimationFrame(dustTick);
}
function nbOpen(){ $("#notebook").hidden=false; $("#nbBackdrop").hidden=false; requestAnimationFrame(()=>{ $("#notebook").classList.add("show"); $("#nbBackdrop").classList.add("show"); }); nbRenderList(); }
function nbClose(){ $("#notebook").classList.remove("show"); $("#nbBackdrop").classList.remove("show"); setTimeout(()=>{ $("#notebook").hidden=true; $("#nbBackdrop").hidden=true; nbCancelDust(); },400); }
$("#nbBtn").addEventListener("click",nbOpen);
$("#nbClose").addEventListener("click",nbClose);
$("#nbBackdrop").addEventListener("click",nbClose);
$("#nbBody").addEventListener("click",e=>{

/* ---------- Bản gốc / nâng cấp ở phần tổng kết ---------- */
function movePill(tg){
  const on=tg.querySelector("button[aria-pressed=true]"), pill=tg.querySelector(".pill");
  if(!on||!pill) return;
  pill.style.left=on.offsetLeft+"px"; pill.style.width=on.offsetWidth+"px";
}
function sizeRecap(pi){
  const w=$("#rc"+pi); if(!w) return;
  const l=w.querySelector(w.dataset.m==="up"?".up":".base");
  /* Đoạn tổng kết gộp cả bài nên có thể dài hơn hẳn từng câu riêng — nếu vượt quá khoảng trống
     dành cho .sents (bị overflow:hidden cắt mất), tự thu nhỏ chữ lại vừa đủ để không bị cắt. */
  w.style.setProperty("--rs",1);
  let h=l.offsetHeight;
  const sentsEl=w.closest(".sents"), budget=sentsEl?parseFloat(getComputedStyle(sentsEl).maxHeight):0;
  if(budget>0 && h>budget){
    w.style.setProperty("--rs",Math.max(.55,budget/h));
    h=l.offsetHeight;   /* đo lại sau khi thu nhỏ vì số dòng có thể đổi */
  }
  w.style.height=h+"px";
}
function movePills(){ document.querySelectorAll(".tg").forEach(movePill); P.forEach((_,pi)=>sizeRecap(pi)); }
/* Phân biệt "chạm để bấm" với "vuốt cuộn đi ngang qua" trên di động: nếu trang đã dịch chuyển
   đáng kể giữa lúc đặt ngón tay xuống và lúc nhấc lên (dù trình duyệt vẫn coi là một cú tap hợp lệ),
   thì bỏ qua click bên dưới — tránh vô tình đổi từ/lưu từ/chuyển A1-A2 chỉ vì ngón tay lướt qua. */
let touchScrollY=null;
addEventListener("touchstart",()=>{ touchScrollY=scrollY; },{passive:true});
document.addEventListener("click",e=>{
  if(touchScrollY!==null){
    const moved=Math.abs(scrollY-touchScrollY)>6;
    touchScrollY=null;
    if(moved) return;
  }
  const sv=e.target.closest(".sv");
  if(sv){
    e.stopPropagation();
    const pi=+sv.dataset.pi, i=+sv.dataset.i;
    const h=passages[pi].hl[i];
    const nowSaved=nbTogglePair({o:h.o,u:h.u,lv:h.lv,vn:h.vn,ex:h.ex,topic:passages[pi].topic});
    sv.classList.toggle("on",nowSaved); sv.setAttribute("aria-pressed",nowSaved); sv.setAttribute("aria-label",nowSaved?"Remove from vocabulary":"Save to vocabulary");
    sv.innerHTML=BOOKMARK(nowSaved);
    return;
  }
  const b=e.target.closest(".tg button");
  if(b){
    const tg=b.parentNode, pi=+tg.dataset.p;
    if(recapMode[pi]===b.dataset.m) return;
    recapMode[pi]=b.dataset.m;
    [...tg.querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed",x===b));
    movePill(tg);
    const w=$("#rc"+pi); w.dataset.m=b.dataset.m; sizeRecap(pi);   /* cả đoạn đổi cùng lúc, chiều cao co giãn mượt */
    return;
  }
  const ph=e.target.closest(".ph,.ph2,mark[data-p]");
  if(ph && ph.dataset.p!==undefined){
    const pi=+ph.dataset.p, i=+ph.dataset.i, o=opts(pi,i);
    if(ph.dataset.r) speak(recapMode[pi]==="up"?o[o.length-1].w:o[0].w);
    else if(ph.classList.contains("ph")){
      /* Bấm/chạm vào cụm từ: nhảy thẳng qua mức nâng cấp (hoặc quay lại bản gốc nếu đang ở mức nâng cấp),
         không cần cuộn đúng khớp mới đổi được chữ. */
      const n=o.length-1, pp=P[pi];
      const target = Math.round(F[pi][i]||0)>=n ? 0 : n;
      pp.pin[i]=target; F[pi][i]=target;
      ph._t=target; if(ph._f===undefined) ph._f=target;
      if(!raf){ lastT=0; raf=requestAnimationFrame(tick); }
      const s=pp.sents.find(x=>x.ph&&x.ph.includes(ph));
      if(s){
        const h=renderCap(s,pi,i,target); renderSave(pp,pi,i,h);
        if(target===n){
          /* Bấm xong = coi như đã cuộn qua đúng đoạn đó: tự cuộn trang tới đúng vị trí tương ứng,
             để tiến trình (Sentence x/y, khoảng cách tới câu kế) luôn khớp với chữ đang hiển thị,
             không bắt người dùng cuộn thêm vô ích cho phần đã "xong" qua việc bấm. */
          const k=s.idx.indexOf(i), cumK=s.steps.slice(0,k).reduce((a,b)=>a+b,0);
          const uTarget=cumK+s.steps[k], posTarget=s.lo+(uTarget/s.total)*(s.hi-s.lo);
          const r=pp.el.getBoundingClientRect(), posNow=clamp(-r.top,0,pp.total);
          if(posTarget>posNow) scrollTo(0,r.top+scrollY+posTarget);
        }
      }
      speak(o[target].w);
    }
  }
});

/* ---------- Browser text-to-speech ---------- */
let voiceKind="female", rate=1;
const FEMALE=/zira|samantha|jenny|aria|susan|hazel|libby|sonia|female|karen|moira|tessa|victoria/i;
const MALE=/david|mark|guy|ryan|daniel|alex|james|george|thomas|male|fred|oliver/i;
function pickVoice(kind){
  const en=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const us=en.filter(v=>/en[-_]US/i.test(v.lang)), pool=us.length?us:en;
  const re=kind==="female"?FEMALE:MALE, other=kind==="female"?MALE:FEMALE;
  return pool.find(v=>re.test(v.name)&&!(kind==="female"&&/\bmale\b/i.test(v.name)&&!/female/i.test(v.name)))
    ||en.find(v=>re.test(v.name))||pool.find(v=>!other.test(v.name))||pool[0]||null;
}
let audioEl=null;
const playBtns=[...document.querySelectorAll(".play")], playIconWraps=[...document.querySelectorAll(".playIconWrap")];
const ICON_PLAY='<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" stroke="none"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" stroke="none"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>';
function setPlayIcon(playing){ playIconWraps.forEach(w=>w.innerHTML = playing ? ICON_PAUSE : ICON_PLAY); }
setPlayIcon(false);
function stopAll(){ if(audioEl){audioEl.pause();audioEl=null} if("speechSynthesis" in window) speechSynthesis.cancel(); setPlayIcon(false); }
function isPlaying(){ return (audioEl&&!audioEl.paused) || ("speechSynthesis" in window && speechSynthesis.speaking); }
function tts(t){   /* dự phòng: giọng của trình duyệt */
  if(!("speechSynthesis" in window)){alert("Your browser does not support text-to-speech.");return}
  const u=new SpeechSynthesisUtterance(t), v=pickVoice(voiceKind);
  u.lang="en-US"; if(v){u.voice=v;u.lang=v.lang}
  u.rate=rate; u.pitch=voiceKind==="female"?1.15:0.8;
  u.onend=()=>setPlayIcon(false);
  speechSynthesis.speak(u); setPlayIcon(true);
}
function speak(t){
  stopAll();
  const id=AUDIO[t];
  if(!id){ tts(t); return; }
  const a=new Audio(`audio/${voiceKind}/${id}.mp3`);
  a.playbackRate=rate; a.preservesPitch=true; audioEl=a;
  const fallback=()=>{ if(audioEl===a){ audioEl=null; tts(t); } };
  a.onerror=fallback; a.onended=()=>{ if(audioEl===a){ audioEl=null; setPlayIcon(false); } };
  a.play().catch(fallback); setPlayIcon(true);
}
function currentText(){
  const {pi,si}=active, s=P[pi].sents[si], tpl=passages[pi].tpl;
  const one=(str,pick)=>str.replace(/\{(\d)\}/g,(_,i)=>pick(+i));
  if(s.recap){
    return one(tpl,i=>{const o=opts(pi,i);return recapMode[pi]==="up"?o[o.length-1].w:o[0].w});
  }
  return one(s.lines.map(l=>l.tpl).join(" "),i=>opts(pi,i)[Math.round(F[pi][i]||0)].w);
}
playBtns.forEach(b=>b.addEventListener("click",()=>{
  if(isPlaying()){stopAll();return}
  speak(currentText());
}));
$("#voice").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;voiceKind=b.dataset.v;
  [...$("#voice").children].forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("#rate").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;rate=+b.dataset.r;
  [...$("#rate").children].forEach(x=>x.setAttribute("aria-pressed",x===b))});

/* ---------- Khởi động ---------- */
build(); buildPlayer(); layout(); measure(); movePills(); update();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layout();measure();movePills();update()});
/* Kích thước trang thay đổi rất nhiều khi layout() vừa chạy xong (thanh cuộn có thể xuất hiện),
   nên đo lại một lần nữa sau khi trình duyệt đã ổn định bố cục để tránh sai lệch nhỏ về độ rộng chữ. */
requestAnimationFrame(()=>requestAnimationFrame(()=>{ layout(); measure(); movePills(); update(); }));

</script>

<script>
/* ---------- Màn hình mở đầu (splash): logo Reed dựng hình rồi thu nhỏ, mờ dần đúng vào chỗ
   logo+tên trên header thật (.top .brand), thay vì "đáp" cứng vào một khung riêng như bản demo gốc —
   nhờ vậy không cần header thật phải đổi giao diện hay tô màu lại. Chỉ chạy chậm/đủ ở lần đầu,
   các lần sau (đã có cờ trong localStorage) chạy nhanh hơn cho đỡ sốt ruột. ---------- */
(function(){
  const el=document.getElementById("reed-splash");
  if(!el) return;
  const lock=el.querySelector(".lockup");
  const brand=document.querySelector(".top .brand");
  const KEY="reed_splash_seen";
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Lưới chấm mờ, gợn sóng cyan lan từ tâm chữ R */
  function dots(cv,s,still){
    const ctx=cv.getContext("2d"), G=28, ring=170, dpr=Math.min(devicePixelRatio||1,2);
    const W=innerWidth, H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const cx=W/2, cy=H/2, maxD=Math.hypot(cx,cy);
    const speed=1100/s, delay=420*s, ox=(W%G)/2, oy=(H%G)/2, t0=performance.now();
    function draw(now){
      const front=still?-1:(now-t0-delay)*speed/1000;
      ctx.clearRect(0,0,W,H);
      for(let x=ox;x<W;x+=G) for(let y=oy;y<H;y+=G){
        const d=Math.hypot(x-cx,y-cy); let k=0;
        for(let w=0;w<2;w++){
          const dl=front-w*120-d;
          if(dl>0&&dl<ring) k=Math.max(k,Math.pow(1-dl/ring,2)*(w?0.5:1));
        }
        ctx.beginPath(); ctx.arc(x,y,1.3+1.6*k,0,6.283);
        ctx.fillStyle=k>0.01?`rgba(47,215,252,${0.12+0.88*k})`:"rgba(255,255,255,.12)";
        ctx.fill();
      }
      if(!still && front-120-maxD<ring) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  }

  function seen(){ try{ return !!localStorage.getItem(KEY); }catch(e){ return false; } }
  const s=reduce?0.4:(seen()?0.7:1.3);
  el.style.setProperty("--s",s);

  function done(){
    el.style.display="none";
    document.body.style.overflow="";
    try{ localStorage.setItem(KEY,"1"); }catch(e){}
  }

  function fly(){
    if(reduce||!brand){ done(); return; }
    const a=lock.getBoundingClientRect(), b=brand.getBoundingClientRect();
    const k=Math.max(.06,b.height/a.height);         /* khớp theo chiều cao hàng header */
    const bx=b.left+b.width/2, by=b.top+b.height/2;  /* thu nhỏ + hội tụ về đúng tâm logo thật trên header */
    const dx=bx-(a.width*k)/2-a.left, dy=by-(a.height*k)/2-a.top;
    const d=700*s;
    el.classList.add("flying");
    lock.style.transformOrigin="0 0";
    lock.animate({transform:["translate(0,0) scale(1)",`translate(${dx}px,${dy}px) scale(${k})`]},
      {duration:d, easing:"cubic-bezier(.16,1,.3,1)", fill:"forwards"});
    const bgFade=el.animate({opacity:[1,0]},{duration:d, easing:"ease-out", fill:"forwards"});
    bgFade.onfinish=done;
  }

  const lr=lock.getBoundingClientRect();
  lock.style.setProperty("--fly",Math.round((lr.left+300)/(lr.width/856)));
  dots(el.querySelector("#reed-dots"),s,reduce);
  el.classList.add("play");
  document.body.style.overflow="hidden";
  const minTime=new Promise(r=>setTimeout(r,1850*s));
  const loaded=new Promise(r=>document.readyState==="complete"?r():addEventListener("load",r,{once:true}));
  Promise.all([minTime,loaded]).then(fly);
})();
</script>
</body>
