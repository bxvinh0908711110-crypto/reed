  const cur=()=>{ const pp=P[active.pi]; return {pp, s:pp&&pp.sents[active.si]}; };
  const phiOn=(s)=>s&&s.idx&&s.idx.length;
  const TIPS={
    swipe:{ icon:coarse?"👆":"🖱️", text:coarse?"Vuốt lên để sang bước tiếp":"Cuộn chuột xuống để sang bước tiếp", dwell:2000, max:3,
      ok:()=>{ const y=firstLessonY(); return scrollY<=y+4; }, anchor:()=>$("#player") },
    tap:{ icon:"✨", text:coarse?"Chạm vào cụm được tô sáng để xem cách nói tự nhiên hơn":"Bấm vào cụm được tô sáng để xem cách nói tự nhiên hơn", dwell:2200, max:2,
      need:["swipe"], pref:"down", under:()=>{ const {s}=cur(); return s&&s.el&&s.el.querySelector(".line"); }, ok:()=>{ const {s}=cur(); return phiOn(s)&&!s.recap&&(F[active.pi][s.idx[0]]||0)<.5; }, anchor:()=>{ const {s}=cur(); return s&&s.ph&&s.ph[0]; }, ring:true },
    listen:{ icon:"🔊", text:"Bấm ▶ để nghe. Bấm ⌄ để đổi giọng và tốc độ", dwell:900, max:2,
      need:["tap"], ok:()=>true, anchor:()=>$("#player") },
    save:{ icon:"🔖", text:"Chạm dấu trang để lưu cụm này vào sổ tay", dwell:5500, max:2,
      need:["tap","listen"], ok:()=>{ const {pp,s}=cur(); return pp&&s&&phiOn(s)&&(F[active.pi][s.idx[0]]||0)>=.5&&pp.sv&&!pp.sv.hidden&&pp.sv.getAttribute("aria-pressed")!=="true"; },
      anchor:()=>{ const {pp}=cur(); return pp&&pp.sv; } },
    recap:{ icon:"🔤", text:"Bấm A1 / A2 để đọc cả đoạn theo từng mức", dwell:1100, max:2,
      need:["tap"], ok:()=>{ const {s}=cur(); return s&&s.recap; }, anchor:()=>{ const {pp}=cur(); return pp&&pp.tg&&!pp.tg.hidden?pp.tg:null; } },
    hold:{ icon:"☝️", text:coarse?"Giữ ngón tay vào tên bài để chuyển sang bài khác":"Nhấn giữ tên bài để chuyển sang bài khác", dwell:3500, max:2,
      need:["tap"], ok:()=>visits>=2, anchor:()=>$("#lessonContent") }
  };
  const ORDER=["swipe","tap","listen","recap","save","hold"];
  let shown=null, shownAt=0, sig="", sigAt=performance.now(), lastHide=0, paused=false;

  function seen(id){ return !!st[id+"_done"]; }
  function done(id){ st[id+"_done"]=1; save(); if(shown===id) hide(); }
  function hide(){
    el.classList.remove("on");
    document.querySelectorAll(".tip-ring").forEach(n=>n.classList.remove("tip-ring"));
    shown=null; lastHide=performance.now();
  }
  function place(a,pref,under){
    const r=a.getBoundingClientRect(), bw=el.offsetWidth, bh=el.offsetHeight, W=innerWidth;
    let top=r.top-bh-14, up=true;
    if(pref==="down"||top<72){ top=r.bottom+14; up=false; }
    if(under&&!up){ top=under.getBoundingClientRect().bottom+12; }   /* nằm dưới cả đoạn chữ để không che chữ */
    if(top+bh>innerHeight-8){ top=r.top-bh-14; up=true; }   /* không đủ chỗ phía dưới → lên trên */
    let left=r.left+r.width/2-bw/2; left=Math.max(12,Math.min(W-bw-12,left));
    el.style.left=left+"px"; el.style.top=top+"px";
    el.style.setProperty("--ax",Math.max(16,Math.min(bw-16,r.left+r.width/2-left))+"px");
    el.classList.toggle("up",up); el.classList.toggle("down",!up);
  }
  function show(id,a){
    const t=TIPS[id]; shown=id; shownAt=performance.now();
    st[id+"_n"]=(st[id+"_n"]||0)+1; save();
    el.querySelector(".ti").textContent=t.icon; el.querySelector(".tt").textContent=t.text;
    el.classList.add("on"); place(a,t.pref,t.under&&t.under());
    if(t.ring) a.classList.add("tip-ring");
  }
  function blocked(){
    return paused||(typeof Rec!=="undefined"&&Rec.open)||(typeof Practice!=="undefined"&&Practice.active)||(typeof Tour!=="undefined"&&(Tour.active||Tour.welcomeOpen))||document.hidden||stepping||switching||!P.length||
      $("#reed-splash")&&getComputedStyle($("#reed-splash")).display!=="none"||
      player.classList.contains("picker-open")||player.classList.contains("settings")||
      !$("#notebook").hidden;
  }
  function tick(){
    const now=performance.now(), s0=active.pi+":"+active.si+":"+Math.round(scrollY/6);
    if(s0!==sig){ sig=s0; sigAt=now; }
    if(blocked()){ if(shown) hide(); return; }
    if(shown){
      const t=TIPS[shown], a=t.anchor();
      if(!a||!t.ok()){ hide(); return; }      /* người dùng đã rời khỏi ngữ cảnh */
      if(now-shownAt>9000){ if((st[shown+"_n"]||0)>=t.max) done(shown); else hide(); return; }
      place(a,t.pref,t.under&&t.under()); return;
    }
    if(now-lastHide<1800) return;
    const dwell=now-sigAt;
    for(const id of ORDER){
      const t=TIPS[id];
      if(seen(id)||(t.need&&!t.need.every(seen))) continue;
      if(!t.ok()||dwell<t.dwell) continue;
      const a=t.anchor(); if(!a) continue;
      show(id,a); break;
    }
  }
  setInterval(tick,400);
  addEventListener("resize",()=>{ if(shown){ const a=TIPS[shown].anchor(); a&&place(a,TIPS[shown].pref,TIPS[shown].under&&TIPS[shown].under()); } });
  el.addEventListener("click",()=>{ if(shown) done(shown); });

  const EVT={ step:["swipe"], tap:["tap"], play:["listen"], save:["save"], recap:["recap"], hold:["hold"] };
  function event(n){ (EVT[n]||[]).forEach(done); }
  function replay(){
    st={}; save(); hide();
    Tour.start();   /* "?" = xem lại tour hướng dẫn (có nút "Làm thử" ở bước cuối); trước đây là bài tập làm, các gợi ý còn lại (A1/A2, lưu, giữ tên bài) hiện lại sau */
  }
  $("#tipBtn").addEventListener("click",replay);
  function mark(ids){ ids.forEach(i=>{ st[i+"_done"]=1; }); save(); }
  return {event,replay,mark};
})();
function tipEvt(n){ try{ Tips.event(n); }catch(e){} try{ Practice.event(n); }catch(e){} }

/* ---------- Bài tập làm: 4 chặng (vuốt → chạm cụm → nghe → xong), dùng đúng engine thật để người dùng học bằng tay ---------- */
const Practice=(function(){
  const coarse=matchMedia("(pointer: coarse)").matches, DONE="reed_practice_done";
  const box=$("#coach"), num=box.querySelector(".cn"), txt=box.querySelector(".ct"), skip=box.querySelector(".cs"), go=box.querySelector(".cb");
  const api={active:false};
  let stage=0, flags={}, timer=0;
  const STAGES=[
    {t:coarse?"Vuốt lên để sang bước tiếp":"Cuộn chuột xuống để sang bước tiếp", done:()=>active.si>=1&&!stepping},
    {t:coarse?"Chạm vào cụm được tô sáng để đổi sang cách nói tự nhiên hơn":"Bấm vào cụm được tô sáng để đổi sang cách nói tự nhiên hơn", done:()=>flags.tap, ring:true},
    {t:"Bấm ▶ ở thanh dưới để nghe câu này", done:()=>flags.play},
    {t:"Tuyệt! Bạn đã biết cách dùng Reed. Chọn một chủ đề để bắt đầu.", final:true}
  ];
  const ring=on=>{ document.querySelectorAll(".tip-ring").forEach(n=>n.classList.remove("tip-ring"));
    if(on){ const pp=P[active.pi], sl=pp&&pp.sents[active.si]; const ph=sl&&sl.ph&&sl.ph[0]; if(ph) ph.classList.add("tip-ring"); } };
  function render(){
    const st=STAGES[stage]; num.textContent=(stage+1)+"/"+STAGES.length; txt.textContent=st.t;
    box.classList.toggle("final",!!st.final); go.hidden=!st.final; box.classList.add("on");
  }
  function finish(){
    api.active=false; clearInterval(timer); box.classList.remove("on"); ring(false);
    try{ localStorage.setItem(DONE,"1"); }catch(e){}
    try{ Tips.mark(["swipe","tap","listen"]); }catch(e){}
  }
  function toTopics(){
    finish();
    let saved=null; try{ saved=localStorage.getItem("reed_topic"); }catch(e){}
    const first=TOPICS.find(t=>t.k!=="practice"&&hasLessons(t.k));
    setTopic(saved&&saved!=="practice"&&hasLessons(saved)?saved:(first?first.k:"family"),false);
    scrollTo(0,0);
  }
  function loop(){
    if(!api.active) return;
    const st=STAGES[stage];
    if(st.ring&&P[active.pi]&&!document.querySelector(".tip-ring")) ring(true);
    if(!st.final&&st.done()){ stage++; flags.tap=flags.tap||false; ring(false); render(); }
  }
  api.event=n=>{ if(!api.active) return; if(n==="tap") flags.tap=true; if(n==="play") flags.play=true; };
  api.start=function(){
    api.active=true; stage=0; flags={};
    try{ localStorage.removeItem(DONE); }catch(e){}
    $("#toast").classList.remove("on");
    curTopic="practice"; passages=ALL.filter(p=>p.cat==="practice");
    setTopic("practice",false);
    document.querySelectorAll("#topics button").forEach(b=>b.setAttribute("aria-pressed","false"));
    scrollTo(0,firstLessonY());
    render(); clearInterval(timer); timer=setInterval(loop,250);
  };
  api.end=()=>{ if(api.active) finish(); };
  skip.addEventListener("click",toTopics); go.addEventListener("click",toTopics);
  api.maybeStart=function(){
    let d=false; try{ d=!!localStorage.getItem(DONE)||!!(JSON.parse(localStorage.getItem("reed_tips")||"{}").swipe_done); }catch(e){}
    if(d) return;
    const sp=$("#reed-splash"); let n=0;
    const w=setInterval(()=>{ n++; if(!sp||getComputedStyle(sp).display==="none"||n>80){ clearInterval(w); if(!api.active) api.start(); } },250);
  };
  return api;
})();

/* ---------- Tour hướng dẫn (cách A): làm tối màn hình, làm nổi từng chỗ, mũi tên chỉ, bấm "Tiếp" qua 8 bước ---------- */
const Tour=(function(){
  const coarse=matchMedia("(pointer: coarse)").matches, DONE="reed_tour_done";
  const blk=$("#tourBlock"), spot=$("#tourSpot"), card=$("#tourCard");
  const nEl=card.querySelector(".tn"), tEl=card.querySelector(".tt"), skipB=card.querySelector(".tk"), backB=card.querySelector(".tb"), nextB=card.querySelector(".tg2"), tryB=card.querySelector(".tx");
  const arr=$("#tourArrow"), pA=arr.querySelector(".ta"), pH=arr.querySelector(".th");
  const api={active:false, welcomeOpen:false};
  let i=0, raf=0, steps=[], demoAdded=null, shownAt=0;
  const phraseSlide=()=>{ const pp=P[0]; if(!pp) return -1; return pp.sents.findIndex(s=>!s.recap&&s.idx&&s.idx.length); };
  const yOfSlide=si=>{ const pp=P[0], s=pp.sents[si]; return pp.el.getBoundingClientRect().top+scrollY+s.lo; };
  const union=(a,b)=>{ if(!a) return b; if(!b) return a; const l=Math.min(a.left,b.left), t=Math.min(a.top,b.top), r=Math.max(a.right,b.right), bt=Math.max(a.bottom,b.bottom); return {left:l,top:t,width:r-l,height:bt-t,right:r,bottom:bt}; };

  function build(){
    steps=[
      {t:"Chọn chủ đề bạn muốn học ở thanh này: Family, Friends, School, Work…", el:()=>$("#topics"), r:999, enter:()=>{ scrollTo(0,0); }},
      {t:"Mỗi bước là một câu ngắn. "+(coarse?"Vuốt lên":"Cuộn chuột xuống")+" để sang bước tiếp, mỗi lần chỉ qua một bước nên bạn không bỏ lỡ gì.", el:()=>P[0]&&P[0].el.querySelector(".sents"), r:18, enter:()=>{ scrollTo(0,firstLessonY()); }},
      {t:(coarse?"Chạm":"Bấm")+" vào cụm được tô sáng để đổi sang cách nói tự nhiên hơn (A1 → A2). Giải nghĩa hiện ngay bên dưới.", el:()=>{ const si=phraseSlide(); const sl=si>=0&&P[0].sents[si]; return sl&&sl.ph&&sl.ph[0]; }, r:12,
        enter:()=>{ const si=phraseSlide(); if(si>=0) scrollTo(0,yOfSlide(si)); }},
      {t:"Bấm ▶ để nghe câu đang đọc.", el:()=>$("#player .play"), r:999},
      {t:"Bấm micro để đọc to câu này. Ghi xong, app phát lại giọng bạn rồi giọng mẫu. Bấm lại micro để ghi lại, nhấn giữ để nghe lại bản đã lưu.", el:()=>$("#micBtn"), r:999},
      {t:"Bấm ⌄ để mở cài đặt: chọn giọng nam / nữ và tốc độ chậm / thường.", el:()=>$("#player"), r:30, wait:480,
        enter:()=>{ player.classList.add("settings"); }, leave:()=>{ player.classList.remove("settings"); }},
      {t:"Chạm vào dấu trang để lưu cụm này vào sổ tay.", el:()=>{ const pp=P[0]; return pp&&pp.sv&&!pp.sv.hidden?pp.sv:$("#nbBtn"); }, r:999},
      {t:"Mọi cụm đã lưu nằm trong Sổ tay (nút ở góc trên), bạn xem lại và ôn tập ở đây.", el:()=>$("#notebook"), r:0, wait:650,
        enter:()=>{
          demoAdded=null;
          if(!nbLoad().length){ const h=passages[0]&&passages[0].hl[0]; if(h){ demoAdded={o:h.o,u:h.u,lv:h.lv,vn:h.vn,ex:h.ex,topic:passages[0].topic}; nbTogglePair(demoAdded); } }   /* cụm mẫu chỉ để minh hoạ, gỡ ngay khi rời bước */
          nbOpen();
        },
        leave:()=>{ nbClose(); if(demoAdded){ nbTogglePair(demoAdded); demoAdded=null; } }},
      {t:(coarse?"Giữ ngón tay":"Nhấn giữ")+" vào tên bài, rồi trượt sang trái / phải để chọn bài khác. Cần xem lại hướng dẫn? Bấm nút “?” trên cùng.", last:true, wait:520, r:30,
        rect:()=>union($("#player").getBoundingClientRect(), $("#pickBubble").getBoundingClientRect()),
        el:()=>$("#player"),
        enter:()=>{ openPicker(); }, leave:()=>{ closePicker(); }}
    ];
  }
  function clamp1(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function measure(){
    const st=steps[i], t=st&&st.el&&st.el(); if(!t) return;
    const r=st.rect?st.rect():t.getBoundingClientRect(), W=innerWidth, H=innerHeight, pad=st.r===999?6:(st.r===0?0:8);
    let x=r.left-pad, y=r.top-pad, w=r.width+pad*2, h=r.height+pad*2;
    spot.style.left=x+"px"; spot.style.top=y+"px"; spot.style.width=w+"px"; spot.style.height=h+"px";
    spot.style.borderRadius=(st.r===999?Math.min(w,h)/2:st.r)+"px";
    const cw=card.offsetWidth, ch=card.offsetHeight, G=46;
    let left, top;
    if(h>H*.6){   /* vùng nổi rất cao (vd. sổ tay): đặt thẻ bên cạnh nếu còn chỗ, nếu không thì ở mép dưới */
      if(x>cw+G+12){ left=x-cw-G; top=clamp1(y+h/2-ch/2,10,H-ch-10); }
      else if(W-(x+w)>cw+G+12){ left=x+w+G; top=clamp1(y+h/2-ch/2,10,H-ch-10); }
      else { left=clamp1(x+w/2-cw/2,12,W-cw-12); top=H-ch-14; }
    } else {
      top=(y+h/2>H*.55)?y-ch-G:y+h+G;
      if(top<10) top=y+h+G; if(top+ch>H-10) top=Math.max(10,y-ch-G);
      if(top<10) top=Math.min(H-ch-10,y+h+G);
      left=clamp1(x+w/2-cw/2,12,W-cw-12);
    }
    card.style.left=left+"px"; card.style.top=top+"px";
    arrow(left,top,cw,ch,x,y,w,h);
  }
  /* Mũi tên cong từ thẻ chỉ vào vùng được làm nổi (như demo) */
  function arrow(cl,ct,cw,ch,x,y,w,h){
    const cb=ct+ch, sb=y+h, cx0=x+w/2, cy0=y+h/2;
    let sx,sy,ex,ey,mx,my;
    if(cb+10<=y){ sx=clamp1(cx0,cl+28,cl+cw-28); sy=cb+3; ex=clamp1(cx0,x+14,x+w-14); ey=y-9; const d=ex>=sx?-1:1; mx=(sx+ex)/2+d*42; my=(sy+ey)/2; }
    else if(ct-10>=sb){ sx=clamp1(cx0,cl+28,cl+cw-28); sy=ct-3; ex=clamp1(cx0,x+14,x+w-14); ey=sb+9; const d=ex>=sx?-1:1; mx=(sx+ex)/2+d*42; my=(sy+ey)/2; }
    else if(cl+cw+10<=x){ sx=cl+cw+3; sy=clamp1(cy0,ct+24,ct+ch-24); ex=x-9; ey=clamp1(cy0,y+14,y+h-14); const d=ey>=sy?-1:1; mx=(sx+ex)/2; my=(sy+ey)/2+d*42; }
    else if(x+w+10<=cl){ sx=cl-3; sy=clamp1(cy0,ct+24,ct+ch-24); ex=x+w+9; ey=clamp1(cy0,y+14,y+h-14); const d=ey>=sy?-1:1; mx=(sx+ex)/2; my=(sy+ey)/2+d*42; }
    else { arr.classList.remove("on"); return; }
    pA.setAttribute("d","M"+sx+" "+sy+" Q"+mx+" "+my+" "+ex+" "+ey);
    const a=Math.atan2(ey-my,ex-mx), L=11, o=.55;
    pH.setAttribute("d","M"+(ex-L*Math.cos(a-o))+" "+(ey-L*Math.sin(a-o))+" L"+ex+" "+ey+" L"+(ex-L*Math.cos(a+o))+" "+(ey-L*Math.sin(a+o)));
    arr.hidden=false; arr.classList.add("on");
  }
  function cleanup(){ const st=steps[i]; if(st&&st.leave){ try{ st.leave(); }catch(e){} } }
  function go(n){ cleanup(); i=n; show(); }
  function show(){
    const st=steps[i];
    nEl.textContent=(i+1)+"/"+steps.length; tEl.textContent=st.t;
    backB.hidden=i===0; tryB.hidden=!st.last; nextB.textContent=st.last?"Xong":"Tiếp"; skipB.hidden=!!st.last;
    card.classList.remove("on"); arr.classList.remove("on");
    if(st.enter) st.enter();
    const token=++shownAt;
    setTimeout(()=>{ if(!api.active||token!==shownAt) return;   /* chờ cuộn / hoạt ảnh mở xong rồi mới đo */
      if(!(st.el&&st.el())){ if(i<steps.length-1){ go(i+1); } else end(); return; }
      measure(); card.classList.add("on"); },st.wait||80);
  }
  function loop(){ if(!api.active) return; measure(); raf=requestAnimationFrame(loop); }
  function end(){
    cleanup();
    api.active=false; cancelAnimationFrame(raf);
    blk.hidden=spot.hidden=card.hidden=true; card.classList.remove("on"); arr.classList.remove("on"); arr.hidden=true;
    try{ localStorage.setItem(DONE,"1"); }catch(e){}
    try{ Tips.mark(["swipe","tap","listen","hold"]); }catch(e){}
    let saved=null; try{ saved=localStorage.getItem("reed_topic"); }catch(e){}
    const first=TOPICS.find(t=>hasLessons(t.k));
    setTopic(saved&&saved!=="practice"&&hasLessons(saved)?saved:(first?first.k:"family"),false);
    scrollTo(0,0);
  }
  api.start=function(){
    if(Practice.active) Practice.end();
    api.active=true; i=0; build();
    let saved=null; try{ saved=localStorage.getItem("reed_topic"); }catch(e){}
    const first=TOPICS.find(t=>hasLessons(t.k));
    setTopic(saved&&saved!=="practice"&&hasLessons(saved)?saved:(first?first.k:"family"),false);
    blk.hidden=spot.hidden=card.hidden=false;
    show(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  };
  api.end=()=>{ if(api.active) end(); };
  nextB.addEventListener("click",()=>{ if(i<steps.length-1) go(i+1); else end(); });
  backB.addEventListener("click",()=>{ if(i>0) go(i-1); });
  skipB.addEventListener("click",()=>end());
  tryB.addEventListener("click",()=>{ end(); Practice.start(); });
  addEventListener("keydown",e=>{ if(!api.active) return;
    if(e.key==="Escape") end(); else if(e.key==="ArrowRight"||e.key==="Enter") nextB.click(); else if(e.key==="ArrowLeft") backB.click();
    e.preventDefault(); e.stopPropagation(); },true);

  /* Hộp chào mừng ở lần vào đầu: "Xem hướng dẫn" hoặc "Đã hiểu" (không bắt người dùng đi tìm nút ?) */
  const wel=$("#welcome");
  function welcomeHide(){ api.welcomeOpen=false; wel.classList.remove("on"); setTimeout(()=>{ wel.hidden=true; },300); }
  api.welcome=function(){
    if(api.active||api.welcomeOpen) return;
    api.welcomeOpen=true; wel.hidden=false; requestAnimationFrame(()=>wel.classList.add("on"));
    wel.querySelector(".w1").focus({preventScroll:true});
  };
  wel.querySelector(".w1").addEventListener("click",()=>{ welcomeHide(); setTimeout(()=>api.start(),320); });
  wel.querySelector(".w2").addEventListener("click",()=>{ welcomeHide(); try{ localStorage.setItem(DONE,"1"); }catch(e){} });
  addEventListener("keydown",e=>{ if(api.welcomeOpen&&e.key==="Escape"){ wel.querySelector(".w2").click(); } },true);
  api.maybeStart=function(){
    let d=false; try{ d=!!localStorage.getItem(DONE)||!!localStorage.getItem("reed_practice_done")||!!(JSON.parse(localStorage.getItem("reed_tips")||"{}").swipe_done); }catch(e){}
    if(d) return;
    const sp=$("#reed-splash"); let n=0;
    const w=setInterval(()=>{ n++; if(!sp||getComputedStyle(sp).display==="none"||n>80){ clearInterval(w); if(!api.active) api.welcome(); } },250);
  };
  return api;
})();

/* ---------- Ghi âm giọng đọc: thanh player biến thành thanh ghi âm → dừng → thẻ nghe lại / so với giọng mẫu.
   Bản ghi chỉ lưu trong máy (IndexedDB). ---------- */
const Rec=(function(){
  const sheet=$("#recSheet"), micB=$("#micBtn");
  const live=$("#recLive"), liveTxt=live.querySelector(".rl-text"), timeEl=live.querySelector(".rtime"), bars=[...live.querySelectorAll(".wave i")], errEl=sheet.querySelector(".rerr");
    const api={state:"idle", open:false};
  let stream=null, mr=null, chunks=[], t0=0, tmr=0, ac=null, an=null, raf=0, curText="", curKey="", curBlob=null, mine=null, seq=0, hist=[], lastPush=0;
  const MAX=60, NB=bars.length;
  /* ---- IndexedDB: giữ tối đa 20 bản ghi gần nhất ---- */
  function db(){ return new Promise((res,rej)=>{ const r=indexedDB.open("reed_rec",1); r.onupgradeneeded=()=>r.result.createObjectStore("rec"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  async function dbGet(k){ try{ const d=await db(); return await new Promise(r=>{ const q=d.transaction("rec").objectStore("rec").get(k); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }catch(e){ return null; } }
  async function dbPut(k,v){ try{ const d=await db(); await new Promise(res=>{ const tx=d.transaction("rec","readwrite"), st=tx.objectStore("rec"); st.put(v,k); const rows=[]; const cur=st.openCursor();
      cur.onsuccess=()=>{ const c=cur.result; if(c){ rows.push({k:c.key,at:c.value.at}); c.continue(); } else rows.sort((a,b)=>b.at-a.at).slice(20).forEach(x=>st.delete(x.k)); };
      tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
  const keyOf=t=>(passages[active.pi]?passages[active.pi].topic:"")+"|"+t;
  const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
  const setState=s=>{ api.state=s; sheet.classList.remove("s-rev","s-err"); if(s==="review") sheet.classList.add("s-rev"); if(s==="err") sheet.classList.add("s-err"); };
  function showSheet(){ api.open=true; sheet.hidden=false; requestAnimationFrame(()=>sheet.classList.add("on")); }
  function hideSheet(){ sheet.classList.remove("on"); setTimeout(()=>{ if(!api.open||api.state==="idle") sheet.hidden=true; },260); }
  function stopPlay(){ if(mine){ mine.pause(); mine=null; } stopAll(); micB.classList.remove("playing"); seq++; }
  function drawBars(){ bars.forEach((b,k)=>{ if(k<hist.length){ b.className=""; b.style.height=(4+hist[k]*24)+"px"; } else { b.className="off"; b.style.height="6px"; } }); }
  function stopMeter(){ cancelAnimationFrame(raf); clearInterval(tmr); try{ ac&&ac.close(); }catch(e){} ac=null; an=null; }
  function release(){ stopMeter(); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } player.classList.remove("recording"); micB.classList.remove("rec"); }
  function fail(msg){ release(); mr=null; errEl.textContent=msg; setState("err"); showSheet(); }
  async function refreshDot(){ const r=await dbGet(keyOf(currentText())); micB.classList.toggle("has",!!r); }

  async function start(){
    stopAll(); stopPlay();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==="undefined"){ return fail("Trình duyệt này chưa hỗ trợ ghi âm. Hãy thử Chrome hoặc Safari bản mới."); }
    curText=currentText(); curKey=keyOf(curText);
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
    catch(e){ return fail(e&&e.name==="NotAllowedError"?"Bạn chưa cho phép dùng micro. Bấm biểu tượng ổ khoá trên thanh địa chỉ, cho phép Micro rồi thử lại.":"Không mở được micro. Kiểm tra micro rồi thử lại."); }
    const mime=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
    chunks=[]; try{ mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined); }catch(e){ return fail("Không khởi động được bộ ghi âm trên thiết bị này."); }
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    mr.onstop=()=>{ const type=(mr&&mr.mimeType)||mime||"audio/webm"; const blob=new Blob(chunks,{type}); const wasRec=api.state==="recording"; if(wasRec){ api.state="idle"; api.open=false; } release(); if(!wasRec) return;
      if(blob.size<800){ return fail("Chưa nghe thấy tiếng. Hãy đọc to hơn và thử lại."); }
      curBlob=blob; dbPut(curKey,{blob,type,at:Date.now(),text:curText}); micB.classList.add("has"); playSeq(); };
    mr.start(250); t0=performance.now(); timeEl.textContent="0:00"; hist=[]; lastPush=0; drawBars(); liveTxt.textContent=curText;
    player.classList.remove("settings"); player.classList.add("recording"); micB.classList.add("rec"); api.state="recording"; api.open=true; hideSheet();
    tmr=setInterval(()=>{ const s=(performance.now()-t0)/1000; timeEl.textContent=fmt(s); if(s>=MAX) stop(); },200);
    let lvl=0;
    try{ ac=new (window.AudioContext||window.webkitAudioContext)(); const src=ac.createMediaStreamSource(stream); an=ac.createAnalyser(); an.fftSize=512; src.connect(an); const d=new Uint8Array(an.fftSize);
      const draw=now=>{ if(!an) return; an.getByteTimeDomainData(d); let sum=0; for(let i=0;i<d.length;i++){ const v=(d[i]-128)/128; sum+=v*v; } lvl=Math.min(1,Math.sqrt(sum/d.length)*5);
        if(now-lastPush>140){ lastPush=now; hist.push(lvl); if(hist.length>NB) hist.shift(); drawBars(); } raf=requestAnimationFrame(draw); }; raf=requestAnimationFrame(draw); }
    catch(e){ tmr2=setInterval(()=>{ hist.push(.2+Math.random()*.5); if(hist.length>NB) hist.shift(); drawBars(); },140); }
  }
  let tmr2=0;
  function stop(){ clearInterval(tmr2); if(mr&&mr.state!=="inactive") mr.stop(); }
  /* Nghe lại ngay sau khi ghi: giọng bạn → giọng mẫu. Trong lúc phát nút mic thành ▶ xanh, chạm để dừng. */
  function playSeq(){
    if(!curBlob) return; stopPlay(); micB.classList.add("playing"); const my=++seq;
    const done=()=>{ if(my===seq) micB.classList.remove("playing"); };
    const a=new Audio(URL.createObjectURL(curBlob)); mine=a;
    a.onended=()=>{ if(my!==seq) return; mine=null; setTimeout(()=>{ if(my!==seq) return; speak(curText,done); },350); };
    a.onerror=done; a.play().catch(done);
  }
  function close(){ if(api.state==="recording") cancelRec(); stopPlay(); api.open=false; api.state="idle"; hideSheet(); }
  function cancelRec(){ api.state="idle"; api.open=false; clearInterval(tmr2); try{ if(mr&&mr.state!=="inactive") mr.stop(); }catch(e){} release(); }
  /* chạm: ghi (hoặc ghi lại); đang phát thì dừng phát. Nhấn giữ khi đã có bản ghi: nghe lại bản đã lưu. */
  let lpT=0, lpFired=false;
  async function onMic(){
    if(lpFired){ lpFired=false; return; }
    if(api.state==="recording") return;
    if(micB.classList.contains("playing")){ stopPlay(); return; }
    if(api.open){ close(); }
    start();
  }
  micB.addEventListener("click",onMic);
  micB.addEventListener("pointerdown",()=>{ lpFired=false; clearTimeout(lpT);
    lpT=setTimeout(async()=>{ if(api.state==="recording"||!micB.classList.contains("has")) return;
      const t=currentText(); curText=t; curKey=keyOf(t); const old=await dbGet(curKey); if(old&&old.blob){ curBlob=old.blob; lpFired=true; playSeq(); } },480); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>micB.addEventListener(ev,()=>clearTimeout(lpT)));
  micB.addEventListener("contextmenu",e=>e.preventDefault());
  $("#recCancel").addEventListener("click",()=>{ cancelRec(); });
  sheet.querySelectorAll(".rdone").forEach(b=>b.addEventListener("click",close));
  addEventListener("keydown",e=>{ if(api.open&&e.key==="Escape"){ if(api.state==="recording") cancelRec(); else close(); } });
  api.close=close; api.stop=stop; api.refreshDot=refreshDot;
  let lastSig=""; setInterval(()=>{ const sg=active.pi+":"+active.si+":"+(F[active.pi]?JSON.stringify(F[active.pi]):""); if(sg!==lastSig){ lastSig=sg; if(!api.open) refreshDot(); } },600);
  return api;
})();

/* ---------- Khởi động ---------- */
(function(){
  const w=$("#rotWord"), words=["speak","write","listen","learn"]; let i=0;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  setInterval(()=>{ w.classList.add("out"); setTimeout(()=>{ i=(i+1)%words.length; w.textContent=words[i]; w.classList.remove("out"); },280); },2400);
})();
const hasLessons=k=>ALL.some(p=>p.cat===k);
function setTopic(k,jump){
  curTopic=k; if(k!=="practice"){ try{localStorage.setItem("reed_topic",k)}catch(e){} }
  passages=ALL.filter(p=>p.cat===k);
  P=makeP(); F=passages.map(()=>({})); recapMode=passages.map(()=>"up");
  unlockedCount=loadUnlocked(); active={pi:0,si:0}; live=[];
  build(); buildPlayer(); layout(); measure(); movePills(); update(); fitSlides();   /* fit sau update() vì chú thích (.cap) chỉ có chữ sau khi update chạy */
  document.querySelectorAll("#topics button").forEach(b=>{ b.setAttribute("aria-pressed",b.dataset.k===k); });
  if(jump) scrollTo(0, firstLessonY());
}
const firstLessonY=()=>{   /* điểm dừng (snap) đầu tiên của bài đầu — để cú vuốt kế tiếp sang ngay bước 2 */
  const pp=P[0], sn=[...pp.el.querySelectorAll(".snap")].map(e=>e.getBoundingClientRect().top+scrollY);
  return sn.length?Math.min(...sn):pp.el.getBoundingClientRect().top+scrollY+pp.sents[0].lo;
};
/* Đổi chủ đề: nội dung mờ đi rất nhanh → đổi → hiện lại trượt nhẹ lên (thanh chủ đề đứng yên) */
let switching=false, pendingTopic=null;
function animateTopic(k){
  if(switching){ pendingTopic=k; return; }   /* bấm liên tiếp: chủ đề bấm sau cùng sẽ được áp dụng */
  const main=$("#main");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ setTopic(k,true); return; }
  switching=true; main.classList.add("leaving");
  setTimeout(()=>{
    setTopic(k,true);
    main.classList.add("entering");
    requestAnimationFrame(()=>requestAnimationFrame(()=>main.classList.remove("leaving")));
    setTimeout(()=>{ main.classList.remove("entering"); switching=false; if(pendingTopic&&pendingTopic!==curTopic){ const n=pendingTopic; pendingTopic=null; animateTopic(n); } else pendingTopic=null; },700);
  },170);
}
(function initTopics(){
  const bar=$("#topics"), toast=$("#toast"); let tt=0;
  bar.innerHTML=TOPICS.map(t=>`<button type="button" data-k="${t.k}" aria-pressed="false"${hasLessons(t.k)?"":' data-soon="1"'}><svg viewBox="${t.vb}" width="20" height="20" fill="currentColor" aria-hidden="true">${t.icon}</svg><span>${t.label}</span></button>`).join("");
  bar.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.soon){ toast.textContent=b.textContent+" lessons are coming soon"; toast.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove("on"),1800); return; }
    if(Practice.active){ Practice.end(); setTopic(b.dataset.k,true); return; }
    animateTopic(b.dataset.k);
  });
  let saved=null; try{saved=localStorage.getItem("reed_topic")}catch(e){}
  const first=TOPICS.find(t=>hasLessons(t.k));
  setTopic(saved&&saved!=="practice"&&hasLessons(saved)?saved:(first?first.k:"family"),false);
  Tour.maybeStart();
})();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layout();measure();movePills();update();fitSlides()});
/* Kích thước trang thay đổi rất nhiều khi layout() vừa chạy xong (thanh cuộn có thể xuất hiện),
   nên đo lại một lần nữa sau khi trình duyệt đã ổn định bố cục để tránh sai lệch nhỏ về độ rộng chữ. */
requestAnimationFrame(()=>requestAnimationFrame(()=>{ layout(); measure(); movePills(); update(); }));

</script>

/* ---------- Nạp bài học: Supabase (có cache) → dự phòng dữ liệu nhúng sẵn trong app ---------- */
(async function(){
  const SB="https://mmadhhjjfqnlhitklfep.supabase.co", KEY="sb_publishable_oHn1ilWP4TE7ICb2HLVOiA_FPwNz7oh", CK="reed_lessons_v1";
  const q=c=>"/rest/v1/lessons?select=id,position,title,level,scene_key,"+(c?"category,":"")+"template,version,phrases(idx,base,upgrade,level,vn,example)&status=eq.published&order=position";
  const TITLE_CAT={"My Hobbies":"lifestyle","Going to School":"school","My Family":"family","Best Friend":"friends","Where is my school?":"school","Love what you do":"work","My Weekend":"lifestyle","Good Morning, Good Health":"health","Technology In Our Life":"tech"};
  const toPassages=rows=>rows.map(r=>({id:r.position,uid:r.id,version:r.version,topic:r.title,level:r.level||"A1",scene:r.scene_key,cat:r.category||TITLE_CAT[r.title]||"lifestyle",tpl:r.template,
    hl:(r.phrases||[]).sort((a,b)=>a.idx-b.idx).map(p=>({o:p.base,u:p.upgrade,lv:p.level||"A2",vn:p.vn||"",ex:p.example||""}))}));
  /* chỉ nhận bài hợp lệ: mọi {n} trong template phải có cụm tương ứng, và có ít nhất 1 cụm */
  const valid=p=>p.tpl&&p.hl.length&&[...p.tpl.matchAll(/\{(\d+)\}/g)].every(m=>+m[1]<p.hl.length)&&p.hl.length===new Set([...p.tpl.matchAll(/\{(\d+)\}/g)].map(m=>m[1])).size;
  let list=null;
  try{
    const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),3500);
    let res=await fetch(SB+q(true),{headers:{apikey:KEY},signal:ctrl.signal});
    if(res.status===400) res=await fetch(SB+q(false),{headers:{apikey:KEY},signal:ctrl.signal});   /* cột category chưa tạo → vẫn nạp được */
    clearTimeout(t);
    if(res.ok){ const rows=await res.json(); const ps=toPassages(rows).filter(valid); if(ps.length){ list=ps; try{localStorage.setItem(CK,JSON.stringify(ps))}catch(e){} } }
  }catch(e){}
  if(!list){ try{ const c=JSON.parse(localStorage.getItem(CK)||"null"); if(Array.isArray(c)&&c.length) list=c; }catch(e){} }
  window.__PASSAGES=list;   /* null → app dùng dữ liệu nhúng */
  const el=document.createElement("script"); el.textContent=document.getElementById("appSrc").textContent; document.body.appendChild(el);
})();

<script>
/* ---------- Màn hình mở đầu (splash): logo Reed dựng hình rồi thu nhỏ, mờ dần đúng vào chỗ
   logo+tên trên header thật (.top .brand), thay vì "đáp" cứng vào một khung riêng như bản demo gốc —
   nhờ vậy không cần header thật phải đổi giao diện hay tô màu lại. Chỉ chạy chậm/đủ ở lần đầu,
   các lần sau (đã có cờ trong localStorage) chạy nhanh hơn cho đỡ sốt ruột. ---------- */
(function(){
  const el=document.getElementById("reed-splash");
  if(!el) return;
  const lock=el.querySelector(".lockup");
  const brand=document.querySelector(".top .brand");
  const KEY="reed_splash_seen";
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Lưới chấm mờ, gợn sóng cyan lan từ tâm chữ R */
  function dots(cv,s,still){
    const ctx=cv.getContext("2d"), G=28, ring=170, dpr=Math.min(devicePixelRatio||1,2);
    const W=innerWidth, H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const cx=W/2, cy=H/2, maxD=Math.hypot(cx,cy);
    const speed=1100/s, delay=420*s, ox=(W%G)/2, oy=(H%G)/2, t0=performance.now();
    function draw(now){
      const front=still?-1:(now-t0-delay)*speed/1000;
      ctx.clearRect(0,0,W,H);
      for(let x=ox;x<W;x+=G) for(let y=oy;y<H;y+=G){
        const d=Math.hypot(x-cx,y-cy); let k=0;
        for(let w=0;w<2;w++){
          const dl=front-w*120-d;
          if(dl>0&&dl<ring) k=Math.max(k,Math.pow(1-dl/ring,2)*(w?0.5:1));
        }
        ctx.beginPath(); ctx.arc(x,y,1.3+1.6*k,0,6.283);
        ctx.fillStyle=k>0.01?`rgba(47,215,252,${0.12+0.88*k})`:"rgba(255,255,255,.12)";
        ctx.fill();
      }
      if(!still && front-120-maxD<ring) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  }

  function seen(){ try{ return !!localStorage.getItem(KEY); }catch(e){ return false; } }
  const s=reduce?0.4:(seen()?0.7:1.3);
  el.style.setProperty("--s",s);

  function done(){
    el.style.display="none";
    document.body.style.overflow="";
    try{ localStorage.setItem(KEY,"1"); }catch(e){}
  }

  function fly(){
    if(reduce||!brand){ done(); return; }
    const a=lock.getBoundingClientRect(), b=brand.getBoundingClientRect();
    const k=Math.max(.06,b.height/a.height);         /* khớp theo chiều cao hàng header */
    const bx=b.left+b.width/2, by=b.top+b.height/2;  /* thu nhỏ + hội tụ về đúng tâm logo thật trên header */
    const dx=bx-(a.width*k)/2-a.left, dy=by-(a.height*k)/2-a.top;
    const d=700*s;
    el.classList.add("flying");
    lock.style.transformOrigin="0 0";
    lock.animate({transform:["translate(0,0) scale(1)",`translate(${dx}px,${dy}px) scale(${k})`]},
      {duration:d, easing:"cubic-bezier(.16,1,.3,1)", fill:"forwards"});
    const bgFade=el.animate({opacity:[1,0]},{duration:d, easing:"ease-out", fill:"forwards"});
    bgFade.onfinish=done;
  }

  const lr=lock.getBoundingClientRect();
  lock.style.setProperty("--fly",Math.round((lr.left+300)/(lr.width/856)));
  dots(el.querySelector("#reed-dots"),s,reduce);
  el.classList.add("play");
  document.body.style.overflow="hidden";
  /* slogan hiện xong lúc 1950*s; giữ thêm một nhịp để người dùng kịp đọc rồi mới thu nhỏ về header */
  const hold=reduce?300:(seen()?750:1300);
  const minTime=new Promise(r=>setTimeout(r,1950*s+hold));
  const loaded=new Promise(r=>document.readyState==="complete"?r():addEventListener("load",r,{once:true}));
  Promise.all([minTime,loaded]).then(fly);
})();
</script>
